name: build-release

on:
  push:
    # 推 main 只构建产物（不建 Release）；打 v* 标签才发版
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（仅手动触发时用于命名，如 v1.0.1）'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish csharp/KurumiSim/KurumiSim.csproj -c Release -r win-x64 --self-contained false -o out

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ github.event.inputs.version }}' }
          $dst = "out/FxKurumiSim-$ver-win64.exe"
          Move-Item "out/久留美模拟器.exe" $dst
          $f = Get-Item $dst
          Write-Host ("built {0}  {1:N0} bytes" -f $f.Name, $f.Length)
          "ARTIFACT=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FxKurumiSim-win64
          path: out/FxKurumiSim-*-win64.exe
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/FxKurumiSim-*-win64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
