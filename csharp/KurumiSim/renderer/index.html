*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:"MiSans","MiSans VF","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#242C36;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#303A46}

#app{display:flex;flex-direction:column;height:100vh}

/* ---------- 顶栏 ---------- */
.top{
  display:flex;align-items:center;gap:18px;height:60px;flex:0 0 60px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.logo{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;
  background-image:var(--logo-idle);
  background-size:cover;background-position:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 2px 8px rgba(0,0,0,.35);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
  cursor:pointer;
}
.logo:hover{
  background-image:var(--logo-hover);
  transform:scale(1.15) rotate(-4deg);
  box-shadow:0 0 0 1px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.5);
}
.brand b{display:block;font-size:13.5px;font-weight:600;letter-spacing:.2px}
.brand span.badge{
  display:inline-flex;align-items:center;gap:5px;margin-top:2px;
  font-size:10.5px;color:var(--mut);letter-spacing:.05em;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.live{background:var(--dn);box-shadow:0 0 0 3px rgba(18,181,126,.15)}
.dot.sim{background:var(--warn);box-shadow:0 0 0 3px rgba(243,178,60,.15)}
.dot.err{background:var(--dngr)}

.acct{display:flex;gap:22px;flex:1;overflow:hidden}
.kpi{min-width:0}
.kpi label{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-bottom:1px;white-space:nowrap}
.kpi b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.kpi b.small{font-size:12.5px}
.cur-col{min-width:190px}
.curstrip{display:flex;gap:11px;font-family:var(--mono);font-size:11px;line-height:1.6;white-space:nowrap}
.curstrip span{color:var(--mut)}
.curstrip span.neg{color:var(--dngr)}
.curstrip span em{font-style:normal;color:var(--dim);font-size:9px;margin-right:3px;letter-spacing:.04em}
.tools{display:flex;align-items:center;gap:8px}
.clockbox{font-family:var(--mono);font-size:10.5px;color:var(--mut);text-align:right;line-height:1.45;white-space:nowrap}
.clockbox i{font-style:normal;color:var(--dim)}

.btn{
  padding:6px 11px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);
  font-size:12px;color:var(--txt);transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:#39434F}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:#2F7BEF}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 板块导航 ---------- */
.boards{
  display:flex;align-items:center;gap:4px;height:42px;flex:0 0 42px;
  padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);
}
.boards .nav{
  padding:6px 14px;border-radius:6px;font-size:12.5px;color:var(--mut);transition:.15s;
  border:1px solid transparent;display:flex;align-items:center;gap:6px;
}
.boards .nav:hover{color:var(--txt);background:var(--panel2)}
.boards .nav.on{color:#fff;background:var(--panel3);border-color:var(--line2)}
.boards .nav em{font-style:normal;font-size:10px;color:var(--dim);font-family:var(--mono)}
.boards .sp{flex:1}
.subtabs{display:flex;gap:2px;padding:2px;background:var(--panel2);border-radius:7px;border:1px solid var(--line)}
.subtabs button{padding:4px 12px;border-radius:5px;font-size:11.5px;color:var(--mut)}
.subtabs button.on{background:var(--panel3);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.3)}

/* ---------- 工作区 ---------- */
.workspace{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:1px;flex:1;min-height:0;background:var(--line)}
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-h{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  height:34px;flex:0 0 34px;padding:0 11px;border-bottom:1px solid var(--line);
  font-size:11px;color:var(--mut);letter-spacing:.1em;
}
.pane-b{flex:1;overflow-y:auto;min-height:0}
.pane-h .seg{display:flex;gap:2px}
.pane-h .seg button{padding:2px 7px;border-radius:4px;font-size:11px;color:var(--dim)}
.pane-h .seg button.on{background:var(--panel3);color:var(--txt)}

/* 行情列表 */
.quote{
  display:grid;grid-template-columns:1fr auto;gap:2px 6px;padding:7px 11px;
  border-bottom:1px solid #151A21;cursor:pointer;transition:.12s;position:relative;
}
.quote:hover{background:var(--panel2)}
.quote.on{background:var(--panel3)}
.quote.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.quote .n{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote .c{font-size:10px;color:var(--dim);font-family:var(--mono);letter-spacing:.02em}
.quote .p{font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:600}
.quote .ch{font-family:var(--mono);font-size:10.5px;text-align:right}
.quote.custom{padding-right:30px}
.quote .del{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;border-radius:4px;font-size:14px;line-height:1;
  color:var(--dim);background:rgba(15,19,24,.95);
  display:grid;place-items:center;opacity:0;transition:.12s;
}
.quote:hover .del{opacity:1}
.quote .del:hover{color:var(--dngr);background:rgba(255,77,79,.16)}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--mut)}

/* 走势图 + 下单 */
.chartwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.chart-head{display:flex;align-items:center;gap:14px;padding:10px 14px 6px;flex-wrap:wrap}
.chart-head .sym{font-size:15px;font-weight:600;letter-spacing:.2px}
.chart-head .code{font-size:11px;color:var(--dim);font-family:var(--mono)}
.chart-head .last{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.4px}
.chart-head .delta{font-family:var(--mono);font-size:12px}
.chart-head .meta{display:flex;gap:12px;margin-left:auto;font-size:10.5px;color:var(--dim);font-family:var(--mono);flex-wrap:wrap}
.chart-head .meta i{font-style:normal;color:var(--mut)}
.tfset{display:flex;gap:2px;padding:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.tfset button{padding:2px 6px;border-radius:4px;font-size:10.5px;font-family:var(--mono);color:var(--dim);transition:.14s}
.tfset button:hover{color:var(--txt)}
.tfset button.on{background:var(--panel3);color:#A8CBFF;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#chart{flex:1;min-height:150px;width:100%;display:block;cursor:crosshair;touch-action:none}

/* 下单区 */
.order{border-top:1px solid var(--line);background:var(--panel2);padding:10px 14px 12px;flex:0 0 auto}
.order-row{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.og{display:flex;flex-direction:column;gap:3px}
.og label{font-size:10px;color:var(--dim);letter-spacing:.06em}
.og .ipt{
  display:flex;align-items:center;background:var(--panel);border:1px solid var(--line2);
  border-radius:6px;height:30px;padding:0 8px;
}
.og .ipt input{background:none;border:none;outline:none;width:100%;font-family:var(--mono);font-size:12.5px;text-align:right}
.og .ipt input::placeholder{color:var(--dim)}
.og .ipt.stepper{gap:0;padding:0}
.og .ipt.stepper button{width:26px;height:28px;color:var(--mut);font-size:14px;line-height:1}
.og .ipt.stepper button:hover{color:var(--txt)}
.og .ipt.stepper input{width:74px;text-align:center}
.side-tog{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;height:30px}
.side-tog button{flex:1;padding:0 16px;font-size:12px;color:var(--mut);background:var(--panel)}
.side-tog button.buy.on{background:rgba(240,85,63,.16);color:var(--up);box-shadow:inset 0 0 0 1px rgba(240,85,63,.35)}
.side-tog button.sell.on{background:rgba(18,181,126,.16);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(18,181,126,.35)}
.levrow{display:flex;align-items:center;gap:9px;margin:2px 0 8px}
.levrow input[type=range]{
  -webkit-appearance:none;flex:1;height:3px;background:var(--line2);border-radius:2px;outline:none;
}
.levrow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);
  border:2px solid var(--panel2);box-shadow:0 0 0 1px var(--acc);cursor:pointer;
}
.levrow .lv{font-family:var(--mono);font-size:12px;min-width:52px;text-align:right;color:var(--acc)}
.levset{display:flex;gap:3px;flex:0 0 auto}
.levset button{
  min-width:27px;padding:3px 6px;border:1px solid var(--line2);border-radius:5px;
  background:var(--panel);color:var(--mut);font-family:var(--mono);font-size:10.5px;
  line-height:1.25;transition:.14s;
}
.levset button:hover:not(:disabled){color:var(--txt);border-color:#3B4654;background:var(--panel3)}
.levset button.on{background:rgba(61,139,255,.18);border-color:rgba(61,139,255,.55);color:#A8CBFF}
.levset button.capped{opacity:.52}
.levset button.third{border-color:rgba(243,178,60,.45);color:var(--warn)}
.levset button.third.on{background:rgba(243,178,60,.18);border-color:var(--warn);color:var(--warn)}
.levset button:disabled{opacity:.3;cursor:not-allowed}
.est{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:7px 16px;
  padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;
}
.est div{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);white-space:nowrap;min-width:0}
.est div span{flex:0 0 auto}
.est div b{font-family:var(--mono);color:var(--mut);font-weight:500;flex:1 1 auto;text-align:right;
  overflow:hidden;text-overflow:ellipsis}
.est div b.hl{color:var(--warn)}
.est div b.neg{color:var(--up)}
.est div.feedetail{white-space:normal;align-items:flex-start}
.est div.feedetail b{white-space:normal;text-align:right;font-size:10px;line-height:1.55;overflow:visible}
.est div.feedetail b em{font-style:normal;color:var(--dim);margin-left:6px}
.submit{width:100%;height:34px;border-radius:6px;font-size:13px;font-weight:600;letter-spacing:.5px;transition:.15s}
.submit.buy{background:var(--up);color:#fff}
.submit.buy:hover{filter:brightness(1.08)}
.submit.sell{background:var(--dn);color:#fff}
.submit.sell:hover{filter:brightness(1.08)}
.submit.cant,.submit:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.45)}
.flyword{font-size:34px;font-weight:800;letter-spacing:3px;color:#F0553F;text-shadow:0 0 22px rgba(240,85,63,.5);animation:flyIn .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes flyIn{from{transform:translateY(-18px) scale(.86);opacity:0}to{transform:none;opacity:1}}
.flysub{margin-top:12px;font-size:12px;color:var(--mut);line-height:1.9}
.submit.cant:hover{filter:grayscale(.45)}
.est b.bad{color:var(--dn)}
.est div.overrow{white-space:normal;align-items:flex-start;font-size:10px;color:#E8877A;padding-top:2px}
.est div.overrow a{color:#F0553F;text-decoration:underline;cursor:pointer}
.submit:disabled{background:#2A323D;color:var(--dim);cursor:not-allowed}

/* 右侧 */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{
  position:sticky;top:0;background:var(--panel);z-index:1;
  padding:6px 8px;text-align:right;font-weight:500;font-size:10px;color:var(--dim);
  letter-spacing:.06em;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px 8px;text-align:right;border-bottom:1px solid #151A21;font-family:var(--mono);white-space:nowrap}
.tbl td:first-child{font-family:inherit}
.tbl tr:hover td{background:var(--panel2)}
.tbl .pos{cursor:pointer}
.tbl .nm{display:block;font-size:11.5px}
.tbl .sub{display:block;font-size:9.5px;color:var(--dim);font-family:var(--mono)}
.empty{padding:26px 12px;text-align:center;color:var(--dim);font-size:11.5px}

.pill{
  display:inline-block;padding:1px 5px;border-radius:3px;font-size:9.5px;
  font-family:var(--mono);letter-spacing:.04em;vertical-align:middle;
}
.pill.l{background:rgba(240,85,63,.15);color:var(--up)}
.pill.s{background:rgba(18,181,126,.15);color:var(--dn)}
.pill.m{background:rgba(61,139,255,.15);color:var(--acc)}
.pill.w{background:rgba(243,178,60,.15);color:var(--warn)}
.pill.d{background:rgba(255,77,79,.15);color:var(--dngr)}

.riskbar{padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel2)}
.riskbar .row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:5px}
.riskbar .row b{font-family:var(--mono);color:var(--mut);font-weight:500}
.meter{height:4px;background:#1B222B;border-radius:3px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--dn);transition:width .4s,background .4s}
.meter i.warn{background:var(--warn)}
.meter i.danger{background:var(--dngr)}
.mcall{
  margin:8px 11px;padding:8px 10px;border-radius:6px;font-size:11px;line-height:1.5;
  background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.35);color:#FFB4B5;
}
.mcall b{color:#fff;font-family:var(--mono)}

/* 绩效板 */
.perf{padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.card label{display:block;font-size:10px;color:var(--dim);letter-spacing:.06em;margin-bottom:3px}
.card b{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.3px}
.card b.sm{font-size:13px}
#eqchart{width:100%;height:190px;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.sect-t{font-size:11px;color:var(--mut);letter-spacing:.12em;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
@media(max-width:1240px){.grid2{grid-template-columns:1fr}}

/* ============ 开局选择 ============ */
.mask.start{background:radial-gradient(1200px 600px at 50% 0%,#151E2C 0%,#07090D 70%)}
.startwrap{width:min(940px,100%);text-align:center}
.starthead h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px}
.starthead p{font-size:12.5px;color:var(--mut);margin-bottom:26px}
.startcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
@media(max-width:820px){.startcards{grid-template-columns:1fr}}
.scard{
  text-align:left;padding:18px 18px 20px;border-radius:12px;border:1px solid var(--line2);
  background:linear-gradient(180deg,#141A22,#0E1218);transition:.18s;position:relative;overflow:hidden;
}
.scard:hover{transform:translateY(-3px);border-color:#3B4654;background:linear-gradient(180deg,#18202A,#10151C)}
.scard.primary{border-color:rgba(61,139,255,.5);box-shadow:0 0 0 1px rgba(61,139,255,.25),0 10px 30px rgba(61,139,255,.12)}
.scard.primary:after{content:"推荐";position:absolute;top:10px;right:10px;font-size:9.5px;
  padding:2px 6px;border-radius:4px;background:rgba(61,139,255,.18);color:#A8CBFF}
.stier{font-size:10px;color:var(--dim);letter-spacing:.1em;margin-bottom:14px}
.sface{font-size:30px;line-height:1;margin-bottom:10px}
.sname{font-size:17px;font-weight:600;margin-bottom:6px}
.samt{font-family:var(--mono);font-size:19px;font-weight:600;color:#fff;letter-spacing:-.4px}
.samt em{font-style:normal;font-size:11px;color:var(--dim);margin-left:4px}
.sdesc{font-size:11px;color:var(--mut);line-height:1.7;margin-top:10px}
.startfoot{font-size:10.5px;color:var(--dim)}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(4,6,9,.72);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.mask.on{display:flex}
.modal{
  width:min(620px,100%);max-height:86vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h b{font-size:14px;font-weight:600}
.mclose{width:28px;height:28px;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--mut);font-size:19px;line-height:1;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.mclose:hover{background:var(--panel3);border-color:var(--line);color:var(--txt)}
.mclose:active{transform:translateY(1px)}
.modal-b{padding:16px 18px}
.modal-b h4{font-size:12px;color:var(--acc);letter-spacing:.08em;margin:16px 0 8px}
.modal-b h4:first-child{margin-top:0}
.modal-b p{font-size:12px;color:var(--mut);line-height:1.75;margin-bottom:6px}
.modal-b ul{margin:0 0 8px 16px;font-size:12px;color:var(--mut);line-height:1.8}
.modal-b li b{color:var(--txt);font-weight:500}
.modal-b code{font-family:var(--mono);font-size:11px;background:var(--panel3);padding:1px 4px;border-radius:3px;color:#9FC5FF}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #171C23}
.frow:last-child{border-bottom:none}
.frow label{font-size:12px;color:var(--txt)}
.frow label i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:2px}
.frow input[type=text],.frow input[type=number],.frow select{
  background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;
  font-family:var(--mono);font-size:11.5px;outline:none;min-width:96px;
}
.frow input[type=text]{width:230px;font-family:var(--mono)}
.frow input:disabled{opacity:.55;cursor:not-allowed}
.switch{position:relative;width:38px;height:21px;background:var(--line2);border-radius:11px;cursor:pointer;transition:.2s;flex:0 0 38px}
.switch.on{background:var(--acc)}
.switch:after{content:"";position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.switch.on:after{left:20px}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99;max-width:340px}
.toast{
  padding:9px 13px;border-radius:8px;background:var(--panel3);border:1px solid var(--line2);
  font-size:11.5px;line-height:1.55;box-shadow:0 10px 26px rgba(0,0,0,.45);
  animation:tin .22s ease-out;border-left:3px solid var(--acc);
}
.toast.err{border-left-color:var(--dngr)}
.toast.ok{border-left-color:var(--dn)}
.toast.warn{border-left-color:var(--warn)}
.toast b{display:block;color:#fff;font-weight:600;margin-bottom:1px}
@keyframes tin{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}

.hint{font-size:10.5px;color:var(--dim);line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11px}
.kv span{color:var(--dim)}
.kv b{font-family:var(--mono);font-weight:500;color:var(--txt);text-align:right}

/* 持仓卡片 */
.posrow{
  padding:7px 11px;border-bottom:1px solid #151A21;cursor:pointer;transition:.12s;position:relative;
}
.posrow:hover{background:var(--panel2)}
.posrow.on{background:var(--panel3)}
.posrow.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.posrow .l1{display:flex;align-items:center;gap:6px}
.posrow .l1 b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.posrow .l1 .q{font-size:10.5px;color:var(--mut);font-family:var(--mono)}
.posrow .l1 .pnl{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600}
.posrow .l2{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posrow .l2 i{font-style:normal;color:var(--mut)}
.posrow .l2 i.warn{color:var(--warn)}
.posrow .l3{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.posrow .l3 span{font-size:9.5px;font-family:var(--mono)}
/* ---------- 语言切换器 ---------- */
.lang{display:flex;gap:4px;align-items:center;margin-left:4px}
.lang button{font-size:11px;padding:3px 7px;border-radius:6px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);line-height:1;letter-spacing:.02em}
.lang button.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.lang button:hover{color:var(--txt)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" data-i18n-skip>
      <div class="logo"></div>
      <div>
        <b>久留美模拟器</b>
        <span class="badge"><i class="dot" id="feedDot"></i><span id="feedTxt">行情初始化…</span></span>
      </div>
    </div>
    <div class="acct">
      <div class="kpi"><label>总权益（折算 JPY）</label><b id="kEq">—</b></div>
      <div class="kpi"><label>可用资金</label><b id="kAvail" class="small">—</b></div>
      <div class="kpi"><label>占用保证金</label><b id="kMargin" class="small">—</b></div>
      <div class="kpi"><label>保证金率</label><b id="kRatio" class="small">—</b></div>
      <div class="kpi"><label>累计盈亏</label><b id="kPnl" class="small">—</b></div>
      <div class="kpi cur-col"><label>现金余额</label><div id="kCashes" class="curstrip">—</div></div>
    </div>
    <div class="tools">
      <div class="clockbox" id="clocks"></div>
      <button class="btn ghost sm" id="btnFx">结汇</button>
      <button class="btn ghost sm" id="btnHelp">交易规则</button>
      <button class="btn ghost sm" id="btnSettings">设置</button>
      <div class="lang" id="langSwitch" data-i18n-skip>
        <button data-lang="zh" class="on">中</button>
        <button data-lang="en">EN</button>
        <button data-lang="ja">日</button>
        <button data-lang="ko">韩</button>
      </div>
    </div>
  </header>

  <nav class="boards">
    <button class="nav on" data-board="stock">股票 <em>JP / US / HK</em></button>
    <button class="nav" data-board="fut">期货 <em>5 品种</em></button>
    <button class="nav" data-board="fx">外汇 <em>4 货币对</em></button>
    <button class="nav" data-board="perf">组合绩效</button>
    <div class="sp"></div>
    <div class="subtabs" id="subTabs">
      <button data-mkt="JP" class="on">日本</button>
      <button data-mkt="US">美国</button>
      <button data-mkt="HK">香港</button>
    </div>
  </nav>

  <div class="workspace">
    <aside class="pane" id="paneWatch">
      <div class="pane-h"><span>自选行情</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span id="watchMeta" style="font-family:var(--mono)">—</span>
          <button class="btn sm" id="btnAddSym" title="添加自选品种" style="padding:1px 7px;font-size:13px;line-height:1.2">＋</button>
        </span>
      </div>
      <div class="pane-b" id="watchList"></div>
    </aside>

    <main class="pane" id="paneCenter">
      <div class="pane" id="viewTrade" style="flex:1;min-height:0">
        <div class="chartwrap">
          <div class="chart-head">
            <span class="sym" id="cName">—</span>
            <span class="code" id="cCode"></span>
            <span class="last" id="cLast">—</span>
            <span class="delta" id="cDelta">—</span>
            <div class="tfset" id="tfSet">
              <button data-tf="m1" class="on">1M</button>
              <button data-tf="m5">5M</button>
              <button data-tf="m10">10M</button>
              <button data-tf="d">日</button>
              <button data-tf="w">周</button>
              <button data-tf="m">月</button>
              <button data-tf="q">季</button>
              <button data-tf="y">年</button>
            </div>
            <div class="meta" id="cMeta"></div>
          </div>
          <canvas id="chart"></canvas>
        </div>
        <div class="order">
          <div class="order-row">
            <div class="og">
              <label>方向</label>
              <div class="side-tog">
                <button class="buy on" data-side="1">买入 / 做多</button>
                <button class="sell" data-side="-1">卖出 / 做空</button>
              </div>
            </div>
            <div class="og">
              <label>委托类型</label>
              <div class="side-tog" style="width:132px">
                <button class="ot on" data-ot="mkt">市价</button>
                <button class="ot" data-ot="lmt">限价</button>
              </div>
            </div>
            <div class="og" id="gLimit" style="display:none">
              <label>限价</label>
              <div class="ipt"><input id="iLimit" type="number" step="any" placeholder="—"></div>
            </div>
            <div class="og">
              <label id="lQty">数量</label>
              <div class="ipt stepper">
                <button id="qMinus">−</button>
                <input id="iQty" type="number" step="any" value="100">
                <button id="qPlus">+</button>
              </div>
            </div>
            <div class="og" style="flex:1;min-width:130px">
              <label id="lLevTxt">杠杆</label>
              <div class="levrow" style="margin:0">
                <div class="levset" id="levSet"></div>
                <input id="iLev" type="range" min="1" max="3.33" step="0.01" value="1">
                <span class="lv" id="levTxt">1.00×</span>
              </div>
            </div>
          </div>
          <div class="est" id="estBox"></div>
          <button class="submit buy" id="btnSubmit">买入</button>
        </div>
      </div>
      <div id="viewPerf" style="display:none;flex:1;min-height:0;flex-direction:column">
        <div class="perf">
          <div class="cards" id="perfCards"></div>
          <div>
            <div class="sect-t"><span>权益曲线 (JPY)</span><span id="eqMeta" class="hint"></span></div>
            <canvas id="eqchart"></canvas>
          </div>
          <div class="grid2">
            <div>
              <div class="sect-t"><span>分板块盈亏</span></div>
              <table class="tbl" id="mktPnl"></table>
            </div>
            <div>
              <div class="sect-t"><span>风险事件</span><button class="btn sm ghost" id="btnExport">导出 CSV</button></div>
              <table class="tbl" id="riskLog"></table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <aside class="pane">
      <div class="riskbar">
        <div class="row"><span>保证金率</span><b id="rRatio">—</b></div>
        <div class="meter"><i id="rMeter" style="width:0%"></i></div>
        <div class="row" style="margin:6px 0 0"><span>维持保证金要求</span><b id="rMaint">—</b></div>
        <div class="row" style="margin-bottom:0"><span>距强平（权益−维持要求）</span><b id="rLine">—</b></div>
      </div>
      <div id="mcallBox"></div>
      <div class="pane-h" style="border-top:1px solid var(--line)">
        <div class="seg" id="sideTabs">
          <button class="on" data-tab="pos">持仓 <span id="nPos">0</span></button>
          <button data-tab="ord">挂单 <span id="nOrd">0</span></button>
          <button data-tab="trd">成交</button>
          <button data-tab="log">日志</button>
        </div>
      </div>
      <div class="pane-b" id="sideBody"></div>
    </aside>
  </div>
</div>
<div id="toasts"></div>

<div class="mask" id="maskSettings">
  <div class="modal">
    <div class="modal-h"><b>设置</b><button class="mclose" data-close title="关闭" aria-label="关闭">×</button></div>
    <div class="modal-b" id="setBody"></div>
  </div>
</div>
<div class="mask" id="maskHelp">
  <div class="modal">
    <div class="modal-h"><b>交易规则与费用说明</b><button class="mclose" data-close title="关闭" aria-label="关闭">×</button></div>
    <div class="modal-b" id="helpBody"></div>
  </div>
</div>
<div class="mask start" id="maskStart">
  <div class="startwrap">
    <div class="starthead">
      <h1>久留美模拟器</h1>
      <p>三种本金，三种活法。选一个开局，随时可在设置里重来。</p>
    </div>
    <div class="startcards">
      <button class="scard" data-start="leek">
        <div class="stier">难度 · 高</div>
        <div class="sface">🥬</div>
        <div class="sname">一般韭菜</div>
        <div class="samt">¥200,000<em>CNY</em></div>
        <div class="sdesc">手上只有人民币。想买日股得先按实时汇率购汇，一手丰田就吃掉 6.7% 权益。</div>
      </button>
      <button class="scard primary" data-start="kurumi">
        <div class="stier">难度 · 中 · 原版体验</div>
        <div class="sface">📈</div>
        <div class="sname">久留美</div>
        <div class="samt">¥10,000,000<em>JPY</em></div>
        <div class="sdesc">日元现金现成，日股 / 期货 / 外汇全开。外汇 25 倍杠杆是她的主场。</div>
      </button>
      <button class="scard" data-start="tycoon">

function levPresets(inst) {
  if (inst.kind === 'fut') return [];                     // 期货杠杆由每手保证金决定

  const rest = inst.kind === 'fx' ? [50, 100] : [5, 10];  // 超出上限的第三方杠杆
  const out = [];
  for (const v of [1, common, cap, ...rest]) {
    if (v > hardMaxOf(inst) + 1e-9 || out.some(x => Math.abs(x - v) < 1e-9)) continue;
    out.push(v);
  }
  return out;
}

  if (!(ccy in state.cash)) state.cash[ccy] = 0;

  const need = -amount;

  state.cash[ccy] = 0;

function autoConvert(ccy, need) {
  const costJPY = need * rateToJPY(ccy) * (1 + CONVERT_SPREAD);
  const others = Object.keys(state.cash).filter(c => c !== ccy && cashOf(c) > 0)

  if (!(src in state.cash)) state.cash[src] = 0;
  const take = costJPY / rateToJPY(src);
  state.cash[src] = cashOf(src) - take;
  state.cash[ccy] = cashOf(ccy) + need;
  const spreadCost = costJPY - need * rateToJPY(ccy);
  state.feeTotal += spreadCost;
  logLine('settle', `自动换汇补足：${fmtN(take, 2)} ${src} → ${fmtN(need, 2)} ${ccy}（点差 ${fmtN(spreadCost, 0)} JPY）`);
  return spreadCost;
}

  const mid = rateToJPY(from) / rateToJPY(to);
  const rate = mid * (1 - CONVERT_SPREAD);
  const got = amt * rate;
  state.cash[from] = cashOf(from) - amt;
  state.cash[to] = cashOf(to) + got;
  state.feeTotal += amt * rateToJPY(from) * CONVERT_SPREAD;
  logLine('settle', `结汇 ${fmtN(amt, 2)} ${from} → ${fmtN(got, 2)} ${to} @ ${num(rate, 4)}`);

    px: px0, prev: seedBars[seedBars.length - 1].c,

    bars: seedBars, hi: Math.max(...seedBars.map(b => b.h)), lo: Math.min(...seedBars.map(b => b.l)),
    open: seedBars[0].o, halt: 0, stale: false
  };
  applySpread(inst, state.clock);
  return quotes[inst.id];
}

function initQuotes() {
  INST.forEach(inst => makeQuote(inst, inst.px));
  // 让 prev 更真实一点：以首根 K 线开盘价为昨收
  INST.forEach(i => { quotes[i.id].prev = quotes[i.id].open; });
}

/* ------------------------------------------------------------

const CUSTOM_MAX = 20;
function inferMarket(code) {

}
function customDefaults(mkt, px) {

  return { ccy: 'USD', lot: 1, initM: 0.50, maintM: 0.25, levMax: 2, fee: 'US', longRate: 0.065, shortRate: 0.08, tick: 0.01 };

function makeCustomSpec(id, name, lot, px, nameEn) {

  };
}
// 读档后把自定义品种并回 INST / IMAP，必须在 initQuotes 之前调用
function buildCustomInstruments() {

  });
}
// 自选股按当前界面语言取名字：中文名 / 英文名（日韩回退英文）
function pickCustomName(spec) {

  return (window.I18N_LANG || 'zh') === 'zh' ? (zh || en) : (en || zh);

function applySpread(inst, t) {
  const q = quotes[inst.id];
  let sp;
  if (inst.kind === 'fx') sp = inst.pip * inst.spread * volatilityMultiplier(inst);
  else sp = Math.max(q.px * 0.00004, (inst.tick || 0.01)) * volatilityMultiplier(inst);
  q.bid = q.px - sp / 2;
  q.ask = q.px + sp / 2;
  q.ts = t;
}

function volatilityMultiplier(inst) {
  const q = quotes[inst.id];
  // 日内波动 U 型 + 停牌冲击
  const hour = Number(new Date(state.clock).toLocaleString('en-US', { timeZone: MARKETS[inst.mkt].tz, hour: '2-digit', hour12: false }));
  const u = 1.18 - 0.34 * Math.sin(((hour - 3) / 24) * Math.PI);
  return u * (q && q.halt > state.clock ? 1.9 : 1);
}

/* ============================================================
   4. 模拟行情引擎（确定性 GBM + 市场因子 + 冲击）
   ============================================================ */
const NEWS = [
  { t: '非农就业数据', mkt: 'US', minute: 8 * 60 + 30, vol: 3.2, jmp: 0.012 },
  { t: '美国 CPI 公布', mkt: 'US', minute: 8 * 60 + 30, vol: 3.4, jmp: 0.014 },
  { t: 'FOMC 利率决议', mkt: 'US', minute: 14 * 60, vol: 4.0, jmp: 0.018 },
  { t: '日银政策会议', mkt: 'JP', minute: 12 * 60, vol: 3.6, jmp: 0.016 },
  { t: '中国制造业 PMI', mkt: 'HK', minute: 9 * 60 + 45, vol: 2.2, jmp: 0.009 },
  { t: 'EIA 原油库存', mkt: 'FUT', minute: 10 * 60 + 30, vol: 3.0, jmp: 0.013 }
];
let activeNews = [];

function simStep(dtSec) {
  const dtYear = dtSec / (365 * 24 * 3600);
  const zMkt = gauss();
  // 板块因子
  const fUS = zMkt * 0.85 + gauss() * 0.53;
  const fJP = zMkt * 0.6 + gauss() * 0.8;
  const fHK = zMkt * 0.55 + gauss() * 0.84;

  INST.forEach(inst => {
    const q = quotes[inst.id];
    if (!q || q.src === 'live') return;               // 实时数据不覆盖
    if (q.halt > state.clock) return;
    let f = inst.mkt === 'US' ? fUS : inst.mkt === 'JP' ? fJP : inst.mkt === 'HK' ? fHK :
            inst.mkt === 'FUT' ? fUS * 0.9 : zMkt * 0.5;
    let shock = 0;
    const news = activeNews.find(n => n.mkt === inst.mkt);
    if (news && news.until > state.clock) { f *= 1.6; shock = news.jmp * (RNG() - 0.5) * 2; }
    const ret = inst.vol * volatilityMultiplier(inst) * Math.sqrt(dtYear) * f + shock;
    let p = q.px * Math.exp(ret);
    const tick = inst.kind === 'fx' ? inst.pip / 10 : (inst.tick || 0.01);
    p = Math.round(p / tick) * tick;                  // 最小变动价位
    if (!Number.isFinite(p) || p <= tick) p = q.px || inst.px;
    q.px = p;
    q.hi = Math.max(q.hi, p);
    q.lo = Math.min(q.lo, p);
    pushBar(inst, p);
    applySpread(inst, state.clock);
    syncFX(inst, p);
  });
}

function syncFX(inst, px) {
  if (inst.kind !== 'fx') return;
  if (inst.id === 'USDJPY=X') state.usdjpy = px;
  else if (inst.id === 'EURUSD=X') state.usdPer.EUR = px;
  else if (inst.id === 'GBPUSD=X') state.usdPer.GBP = px;
  else if (inst.id === 'AUDJPY=X') state.usdPer.AUD = px / state.usdjpy;
}

function pushBar(inst, px) {
  const q = quotes[inst.id];
  const bucket = Math.floor(state.clock / 60000) * 60000;
  const last = q.bars[q.bars.length - 1];
  if (!last || last.t < bucket) {
    q.bars.push({ t: bucket, o: px, h: px, l: px, c: px });
    if (q.bars.length > 600) q.bars.shift();
  } else {
    last.h = Math.max(last.h, px);
    last.l = Math.min(last.l, px);
    last.c = px;
  }
}

/* ============================================================

const feed = { status: 'init', okAt: 0, fail: 0, inflight: false, msg: '初始化' };

/* 本地代理：支持直接填端口（6789 / 127.0.0.1:6789 / http://host:port / socks5://host:port）。
   桌面版把地址交给 C# 端重建 HttpClient；浏览器版无法设置系统代理，忽略。 */
function proxyArg(v) {

  } else if (notify) {

}
async function netGet(url) {
  if (window.Kurumi && window.Kurumi.httpGet) return await window.Kurumi.httpGet(url);
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}
function applyLive(inst, o) {
  const q = quotes[inst.id];
  if (!q || !(o.px > 0)) return;
  // 从模拟切到真实行情的首帧：模拟历史与真实价位不同源，必须丢弃，否则会拼出跨整屏的假柱子
  if (q.src !== 'live') { q.bars = []; q.hi = 0; q.lo = 0; }
  q.px = o.px; q.src = 'live'; q.stale = false;
  if (o.prev > 0) q.prev = o.prev;
  if (o.open > 0) q.open = o.open;
  if (Number.isFinite(o.hi) && o.hi > 0) q.hi = Math.max(q.hi, o.hi);
  if (Number.isFinite(o.lo) && o.lo > 0) q.lo = q.lo ? Math.min(q.lo, o.lo) : o.lo;
  applySpread(inst, state.clock);
  syncFX(inst, o.px);
  pushBar(inst, o.px);
}
// 腾讯：一次请求取多只，字段 3=现价 4=昨收 5=今开 33=最高 34=最低
async function pollStocks(list) {
  const codes = list.map(cnCode).filter(Boolean);

// 新浪外汇：字段 1=买价 2=卖价 3=昨收
async function pollFxPairs(list) {
  const pairs = list.map(i => FX_SINA[i.id]).filter(Boolean);
  if (!pairs.length) return 0;
  const txt = await netGet('https://hq.sinajs.cn/list=' + pairs.join(','));

}
/* ---------- 历史 K 线：腾讯分钟线 / 日周月线 ---------- */
function klSymbol(inst) { return cnCode(inst); }
function parseKlTime(s) {
  const t = String(s);
  if (/^\d{12}$/.test(t)) return Date.UTC(+t.slice(0, 4), +t.slice(4, 6) - 1, +t.slice(6, 8), +t.slice(8, 10), +t.slice(10, 12));
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t);
  if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3], 15, 0);
  return 0;
}
function normKl(arr) {
  const out = [];
  for (const a of arr) {
    if (!Array.isArray(a) || a.length < 5) continue;
    const t = parseKlTime(a[0]);
    const o = +a[1], c = +a[2], h = +a[3], l = +a[4];
    if (!t || !(o > 0) || !(c > 0)) continue;
    out.push({ t, o, c, h: Math.max(h, o, c), l: Math.min(l, o, c) });
  }
  out.sort((x, y) => x.t - y.t);
  return out;
}
// 按自然周/月/季/年聚合，与真实周期口径一致
function periodKey(t, p) {
  const d = new Date(t);
  if (p === 'w') {
    const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    const day = x.getUTCDay() || 7;
    x.setUTCDate(x.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
    return x.getUTCFullYear() * 100 + Math.ceil(((x - y0) / 86400000 + 1) / 7);
  }
  if (p === 'm') return d.getUTCFullYear() * 100 + d.getUTCMonth() + 1;
  if (p === 'q') return d.getUTCFullYear() * 10 + Math.floor(d.getUTCMonth() / 3) + 1;
  return d.getUTCFullYear();
}
function aggByPeriod(bars, p) {
  const out = [];
  let cur = null, key = null;
  for (const b of bars) {
    const k = periodKey(b.t, p);
    if (!cur || k !== key) {
      if (cur) out.push(cur);
      cur = { t: b.t, o: b.o, h: b.h, l: b.l, c: b.c };
      key = k;
    } else {
      cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l); cur.c = b.c;
    }
  }
  if (cur) out.push(cur);
  return out;
}
// 兜底源日线落盘：写到 文档\KurumiSim\klines\<id>.json，与 C# DownloadKline 同格式
function saveKlCache(inst, bars) {
  if (!(window.Kurumi && window.Kurumi.saveKline) || !bars || bars.length < 5) return;
  try {
    const r4 = v => Math.round(v * 1e4) / 1e4;
    const payload = JSON.stringify(bars.map(b => [b.t, r4(b.o), r4(b.h), r4(b.l), r4(b.c)]));
    window.Kurumi.saveKline(inst.id, payload).catch(() => {});
  } catch (e) { /* 落盘失败不影响显示 */ }
}
// 日线打底：美股走新浪（1984 起全历史），港股/日股走腾讯
async function fetchDaily(inst) {
  let bars = [];
  // 1) 本地已扒下来的日线缓存（2000 起）
  if (window.Kurumi && window.Kurumi.readKline) {
    try {
      const t = await window.Kurumi.readKline(inst.id);
      if (t) {
        const j = JSON.parse(t);
        if (j && Array.isArray(j.bars) && j.bars.length) {
          return j.bars.map(b => ({ t: b[0], o: b[1], h: b[2], l: b[3], c: b[4] }));
        }
      }
    } catch (e) { /* 缓存损坏则继续 */ }
  }
  // 2) 主进程走 6789 代理现拉 Yahoo（并顺手落盘）
  if (window.Kurumi && window.Kurumi.downloadKline) {
    try {
      const r = await window.Kurumi.downloadKline(inst.id, inst.yahoo || inst.id);
      if (r && r.n > 0) {
        const t = await window.Kurumi.readKline(inst.id);
        const j = JSON.parse(t);
        if (j && Array.isArray(j.bars) && j.bars.length) {
          return j.bars.map(b => ({ t: b[0], o: b[1], h: b[2], l: b[3], c: b[4] }));
        }
      }
    } catch (e) { /* 代理不可用则走国内源 */ }
  }
  // 3) 国内免费源兜底
  try {
    if (inst.mkt === 'US') {
      const sym = String(inst.code).toUpperCase();
      const txt = await netGet('https://stock.finance.sina.com.cn/usstock/api/jsonp_v2.php/var%20_D=/US_MinKService.getDailyK?symbol=' + sym + '&___qn=3');
      const m = txt.match(/=\((\[[\s\S]*\])\)/);
      if (m) {
        bars = JSON.parse(m[1])
          .map(x => ({ t: parseKlTime(x.d), o: +x.o, h: +x.h, l: +x.l, c: +x.c }))
          .filter(b => b.t && b.o > 0 && b.c > 0)
          .sort((a, b) => a.t - b.t);
      }
    } else {
      const sym = klSymbol(inst);
      if (sym) {
        const txt = await netGet('https://ifzq.gtimg.cn/appstock/app/fqkline/get?param=' + sym + ',day,,,320,qfq');
        const dd = (JSON.parse(txt).data || {})[sym] || {};
        bars = normKl(dd.day || dd.qfqday || []);
      }
    }
  } catch (e) { bars = []; }
  // 兜底源抓到的就顺手落盘，下次启动直接命中本地缓存（否则自选股每次重启都要重抓）
  if (bars.length >= 5) saveKlCache(inst, bars);
  return bars.length >= 5 ? bars : [];
}
function syncPriceFromBars(inst, bars) {
  const q = quotes[inst.id];
  if (!q || q.src === 'live' || !bars || bars.length < 2) return;
  const last = bars[bars.length - 1], prev = bars[bars.length - 2];
  if (!(last.c > 0)) return;
  q.px = last.c;
  q.prev = prev.c || last.c;
  q.open = last.o;
  q.hi = last.h;
  q.lo = last.l;
  // 分钟模拟序列整体缩放到新价位，避免"1M 图 39000 / 报价 64000"的割裂
  const lb = q.bars[q.bars.length - 1];
  if (lb && lb.c > 0) {
    const k = q.px / lb.c;
    q.bars.forEach(x => { x.o *= k; x.h *= k; x.l *= k; x.c *= k; });
  }
  applySpread(inst, state.clock);
}

async function loadKline(inst, tf) {
  const q = quotes[inst.id];
  if (!q) return false;
  q.kl = q.kl || {};
  if (tf === 'm1' || tf === 'm5' || tf === 'm10') return false;   // 分钟线用本地实时累积
  if (q.kl[tf] && q.kl[tf].length) return true;
  if (!q.kl._d) q.kl._d = await fetchDaily(inst);
  const d = q.kl._d;
  if (!d || !d.length) return false;
  syncPriceFromBars(inst, d);        // 期货无实时源时，用日线收盘价对齐报价
  const per = { d: '', w: 'w', m: 'm', q: 'q', y: 'y' }[tf];
  const bars = per ? aggByPeriod(d, per) : d;
  if (!bars.length) return false;
  q.kl[tf] = bars.slice(-400);
  return true;
}
function chartBars(inst) {
  const q = quotes[inst.id];
  const tf = ui.tf || 'm1';
  if (q.kl && q.kl[tf] && q.kl[tf].length) return q.kl[tf].slice(-110);
  const n = { m1: 1, m5: 5, m10: 10 }[tf];
  if (!n) return [];                       // 日/周/月/季/年没有历史源时明确留空，不用分钟数据冒充
  return aggregateBars(q.bars, n).slice(-110);
}

async function pollFeed() {
  if (feed.inflight) return;
  if (state.feedMode === 'sim') { setFeed('sim', '模拟行情引擎'); return; }
  feed.inflight = true;
  try {
    const need = new Set(INST.filter(i => i.mkt === currentMkt()).map(i => i.id));
    state.positions.forEach(p => need.add(p.sym));
    const list = INST.filter(i => need.has(i.id));
    const stocks = list.filter(i => i.kind === 'stock');
    const fx = list.filter(i => i.kind === 'fx');
    let ok = 0;
    if (stocks.length) ok += await pollStocks(stocks);
    if (fx.length) ok += await pollFxPairs(fx);
    if (ok > 0) {
      feed.okAt = Date.now(); feed.fail = 0;
      setFeed('live', `实时行情 · ${ok} 个品种已同步`);
    } else throw new Error('无数据');
  } catch (e) {
    feed.fail++;
    setFeed('sim', '实时不可用（离线或跨域）· 已切模拟引擎');
    INST.forEach(i => { const q = quotes[i.id]; if (q) q.src = 'sim'; });
  }
  feed.inflight = false;
}

function setFeed(kind, msg) {
  feed.status = kind; feed.msg = msg;
  const dot = $('#feedDot'), txt = $('#feedTxt');
  dot.className = 'dot ' + (kind === 'live' ? 'live' : kind === 'sim' ? 'sim' : 'err');

/* ============================================================
   6. 工具：时间 / 日志 / 提示 / 存档
   ============================================================ */
function mktNow(tz) {
  return new Date(new Date(state.clock).toLocaleString('en-US', { timeZone: tz }));
}
function sessionState(inst) {
  if (state.ignoreSession) return { open: true, txt: '练习模式' };
  const M = MARKETS[inst.mkt];
  const d = mktNow(M.tz);
  const day = d.getDay(), mins = d.getHours() * 60 + d.getMinutes();
  if (!M.weekdays.includes(day)) return { open: false, txt: '休市' };
  const inS = M.sess.some(([h1, m1, h2, m2]) => mins >= h1 * 60 + m1 && mins < h2 * 60 + m2);
  if (inS) return { open: true, txt: '交易中' };
  if (inst.mkt === 'US') {
    const pre = M.pre, post = M.post;
    if (mins >= pre[0] * 60 + pre[1] && mins < pre[2] * 60 + pre[3]) return { open: true, txt: '盘前' };
    if (mins >= post[0] * 60 + post[1] && mins < post[2] * 60 + post[3]) return { open: true, txt: '盘后' };
  }
  return { open: false, txt: '休市' };
}
function toast(title, msg = '', kind = '') {

  el.className = 'toast ' + kind;
  el.innerHTML = `<b>${title}</b>${msg ? `<span>${msg}</span>` : ''}`;
  $('#toasts').appendChild(el);

}

/* 存储适配层：桌面版写「文档\KurumiSim\save.json」，浏览器版回退 localStorage */
const store = {
  native: !!(typeof window !== 'undefined' && window.Kurumi && window.Kurumi.isNative),
  raw: '',
  async init() {
    try {
      this.raw = this.native ? (await window.Kurumi.readSave()) || ''
                             : localStorage.getItem(SAVE_KEY) || '';
    } catch (e) { this.raw = ''; }
  },
  write(str) {
    this.raw = str;                       // 同步内存快照，避免后续 load() 读到旧档
    if (this.native) { window.Kurumi.writeSave(str).catch(() => {}); return; }
    try { localStorage.setItem(SAVE_KEY, str); } catch (e) { /* 隐私模式静默失败 */ }
  },
  clear() {
    if (this.native) { window.Kurumi.clearSave().catch(() => {}); return; }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }
};

function snapshot() {
  return JSON.stringify({
    v: 3, seed: state.seed, clock: Date.now(), cash: state.cash, usdPer: state.usdPer,
    usdjpy: state.usdjpy, initEquity: state.initEquity, started: state.started,
    positions: state.positions, orders: state.orders,
    trades: state.trades.slice(0, 400), eq: state.eq.slice(-800), log: state.log.slice(0, 120),
    dayTrades: state.dayTrades, marginCall: state.marginCall, liquidationCount: state.liquidationCount,
    feeTotal: state.feeTotal, swapTotal: state.swapTotal, realized: state.realized,
    settlements: state.settlements, nextSettle: state.nextSettle,
    custom: state.custom,
    feedMode: state.feedMode, proxy: state.proxy, proxyMigrated: state.proxyMigrated, pollMs: state.pollMs,
    ignoreSession: state.ignoreSession, accel: state.accel
  });
}
function save() {
  try { store.write(snapshot()); state.lastSave = Date.now(); } catch (e) {}
}
function load() {
  let raw = '';
  try {
    raw = store.raw;
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (!o || o.v !== 3) return false;
    // 旧档迁移：cash 曾是单一日元数字
    let cash = o.cash;
    if (typeof cash === 'number') cash = { JPY: cash, USD: 0, HKD: 0, CNY: 0 };
    else if (!cash || typeof cash !== 'object') cash = { JPY: 10000000, USD: 0, HKD: 0, CNY: 0 };
    Object.assign(state, {
      seed: o.seed ?? state.seed, cash, usdPer: o.usdPer ?? state.usdPer,
      initEquity: o.initEquity ?? 10000000, started: o.started ?? true,
      usdjpy: o.usdjpy ?? state.usdjpy, positions: o.positions ?? [], orders: o.orders ?? [],
      trades: o.trades ?? [], eq: o.eq ?? state.eq, log: o.log ?? [],
      dayTrades: o.dayTrades ?? [], marginCall: o.marginCall ?? null,
      liquidationCount: o.liquidationCount ?? 0, feeTotal: o.feeTotal ?? 0,
      swapTotal: o.swapTotal ?? 0, realized: o.realized ?? 0,
      settlements: o.settlements ?? [], nextSettle: o.nextSettle ?? 0,
      custom: Array.isArray(o.custom) ? o.custom : [],
      // 旧档里的 auto 迁移为 live：默认真实行情
      feedMode: (o.feedMode && o.feedMode !== 'auto') ? o.feedMode : 'live',
      proxy: o.proxy ?? '', proxyMigrated: o.proxyMigrated ?? false, pollMs: o.pollMs ?? 30000,
      ignoreSession: o.ignoreSession ?? true, accel: o.accel ?? 60
    });
    // 旧档迁移：代理原先硬编码在程序里（127.0.0.1:6789），升级后先沿用；用户清空一次后不再回填
    if (!state.proxyMigrated) {
      if (!state.proxy) state.proxy = '127.0.0.1:6789';
      state.proxyMigrated = true;
    }
    return true;
  } catch (e) { return false; }
}

/* ============================================================
   7. 账户与持仓核算
   ============================================================ */
state.board = 'stock';
state.prevBoard = 'stock';
state.mkt = 'JP';
function currentMkt() {
  const b = state.board === 'perf' ? state.prevBoard : state.board;
  return b === 'stock' ? state.mkt : b === 'fut' ? 'FUT' : b === 'fx' ? 'FX' : 'JP';
}

// 建仓名义价值（日元）
function marginOf(inst, qty, px, lev) {
  if (inst.kind === 'fut') return qty * cvt(inst.margin, inst.ccy);
  if (inst.kind === 'fx') return (qty * inst.units * rateToJPY(inst.base)) / lev;
  return (qty * px * rateToJPY(inst.ccy)) / lev;
}
// 当前维持保证金要求（日元，随市价变动）
function maintOf(pos) {
  const inst = IMAP[pos.sym], q = quotes[pos.sym];
  if (inst.kind === 'fut') return pos.qty * cvt(inst.mm, inst.ccy);
  if (inst.kind === 'fx') return (pos.qty * inst.units * rateToJPY(inst.base)) / inst.levMax;
  return pos.qty * q.px * rateToJPY(inst.ccy) * maintRateOf(pos);
}
// 浮动盈亏（日元）
function pnlOf(pos) {
  const inst = IMAP[pos.sym], q = quotes[pos.sym];
  let raw;
  if (inst.kind === 'fx') raw = pos.qty * inst.units * (q.px - pos.entry);
  else if (inst.kind === 'fut') raw = pos.qty * inst.mult * (q.px - pos.entry);
  else raw = pos.qty * (q.px - pos.entry);
  return pos.dir * cvt(raw, inst.ccy);
}
function notionalOf(pos) {
  const inst = IMAP[pos.sym], q = quotes[pos.sym];
  if (inst.kind === 'fut') return qty2notional(inst, pos.qty, q.px);
  if (inst.kind === 'fx') return pos.qty * inst.units * rateToJPY(inst.base);
  return pos.qty * q.px * rateToJPY(inst.ccy);
}
function qty2notional(inst, qty, px) {
  if (inst.kind === 'fut') return qty * inst.mult * px * rateToJPY(inst.ccy);
  if (inst.kind === 'fx') return qty * inst.units * rateToJPY(inst.base);
  return qty * px * rateToJPY(inst.ccy);
}

// 预估强平价（返回 0 表示无杠杆，不会强平）
function liqPrice(inst, dir, entry, lev) {
  if (inst.kind === 'fut') {
    const gap = (inst.margin - inst.mm) / inst.mult;
    return dir > 0 ? entry - gap : entry + gap;
  }
  if (lev <= 1) return 0;
  if (inst.kind === 'fx') {
    const a = 1 - 1 / lev, b = 1 - 1 / inst.levMax;
    return dir > 0 ? entry * a / b : entry * (1 + 1 / lev) / (1 + 1 / inst.levMax);
  }
  const mr = isThird(inst, lev) ? Math.max(0.01, 0.6 / lev) : inst.maintM;
  return dir > 0 ? entry * (1 - 1 / lev) / (1 - mr)
                 : entry * (1 + 1 / lev) / (1 + mr);
}

function account(excludeOrderId) {
  let unreal = 0, used = 0, maint = 0, notional = 0, frozen = 0;
  for (const p of state.positions) {
    unreal += pnlOf(p); used += p.marginJPY; maint += maintOf(p); notional += notionalOf(p);
  }
  // 未成交挂单按剩余数量冻结保证金与费用
  for (const o of state.orders) {
    if (o.id === excludeOrderId) continue;
    const rest = o.qty - o.filled;
    if (rest <= 1e-9) continue;
    const inst = IMAP[o.sym];
    if (!inst) continue;
    frozen += marginOf(inst, rest, o.limitPx, o.lev) + calcFee(inst, o.dir, rest, o.limitPx).jpy;
  }
  const equity = cashJPY() + unreal;
  return { equity, unreal, used, maint, notional, frozen,
    avail: equity - used - frozen,
    ratio: used > 0 ? (equity / used) * 100 : Infinity };
}

/* ============================================================
   8. 费用模型（分市场，逐项可查）
   ============================================================ */
function calcFee(inst, side, qty, px) {
  const items = [];
  if (inst.kind === 'stock') {
    const n = qty * px;
    if (inst.fee === 'JP') {
      items.push({ k: '交易佣金 0.05%', v: n * 0.0005 });
    } else if (inst.fee === 'US') {
      items.push({ k: '佣金（零佣金）', v: 0 });
      if (side < 0) {
        items.push({ k: 'SEC 规费 0.00278%', v: Math.ceil(n * 0.0000278 * 100) / 100 });
        items.push({ k: 'FINRA TAF $0.000166/股', v: Math.min(qty * 0.000166, 8.3) });
      }
    } else if (inst.fee === 'HK') {
      items.push({ k: '佣金 0.03%（低消 50）', v: Math.max(n * 0.0003, 50) });
      items.push({ k: '印花税 0.1%（双向）', v: Math.ceil(n * 0.001) });
      items.push({ k: '交易征费 0.0027%', v: n * 0.000027 });
      items.push({ k: '交易费 0.00565%', v: n * 0.0000565 });
      items.push({ k: 'FRC 征费 0.00015%', v: n * 0.0000015 });
      items.push({ k: 'CCASS 结算费', v: clamp(n * 0.00002, 2, 100) });
    }
  } else if (inst.kind === 'fut') {
    items.push({ k: `手续费 ${inst.feePer}/${k(inst.ccy)} × ${qty} 手`, v: inst.feePer * qty });
  } else {
    // 点差已体现在成交价里，仅作展示，不重复计入费用合计
    items.push({ k: `点差 ${inst.spread} pip（含于成交价）`, v: inst.pip * inst.spread * qty * inst.units, info: true });
  }
  const total = items.filter(i => !i.info).reduce((a, b) => a + b.v, 0);
  return { items, total, ccy: inst.ccy, jpy: cvt(total, inst.ccy) };
}
const CSYM = { JPY: '¥', USD: '$', HKD: 'HK$', EUR: '€', GBP: '£', AUD: 'A$' };
const k = c => CSYM[c] || c;

/* ============================================================
   9. 持仓开平
   ============================================================ */
function openPos(inst, dir, qty, px, lev) {
  if (!(qty > 0) || !Number.isFinite(px) || px <= 0) return null;
  const margin = marginOf(inst, qty, px, lev);
  const fee = calcFee(inst, dir, qty, px);
  let thirdFee = 0;
  if (isThird(inst, lev)) {
    thirdFee = qty2notional(inst, qty, px) * THIRD_FEE;   // 原币
    fee.items.push({ k: `第三方杠杆佣金 ${num(THIRD_FEE * 100, 1)}%`, v: thirdFee });
    fee.total += thirdFee;
    fee.jpy = cvt(fee.total, inst.ccy);
  }
  moveCash(inst.ccy, -fee.total);
  state.feeTotal += fee.jpy;
  const pos = {
    id: uid(), sym: inst.id, dir, qty, entry: px, lev, openedAt: state.clock,
    marginJPY: margin, feeJPY: fee.jpy, swapAcc: 0
  };
  // 同向同杠杆合并
  const same = state.positions.find(p => p.sym === inst.id && p.dir === dir && Math.abs(p.lev - lev) < 0.01);
  if (same) {
    const totQ = same.qty + qty;
    same.entry = (same.entry * same.qty + px * qty) / totQ;
    same.qty = totQ;
    same.marginJPY += margin;
    same.feeJPY += fee.jpy;
    pos.id = same.id;
    recordTrade(inst, dir, qty, px, fee, 0, 'open');
  } else {
    state.positions.push(pos);
    recordTrade(inst, dir, qty, px, fee, 0, 'open');
  }
  logLine('trade', `${dir > 0 ? '买入开仓' : '卖出开仓'} ${inst.name} ${fmtQty(inst, qty)} @ ${num(px, px < 10 ? 4 : 2)}`);
  return pos;
}

function closePos(pos, qty, px, why) {
  const inst = IMAP[pos.sym];
  const side = -pos.dir;
  const fee = calcFee(inst, side, qty, px);
  let raw;
  if (inst.kind === 'fx') raw = qty * inst.units * (px - pos.entry);
  else if (inst.kind === 'fut') raw = qty * inst.mult * (px - pos.entry);
  else raw = qty * (px - pos.entry);
  const pnlNat = pos.dir * raw;                 // 原币盈亏
  const pnl = cvt(pnlNat, inst.ccy);            // 折算 JPY（统计用）
  moveCash(inst.ccy, pnlNat);                   // 盈亏计入原币现金
  moveCash(inst.ccy, -fee.total);               // 费用扣原币
  state.feeTotal += fee.jpy;
  state.realized += pnl - fee.jpy;
  const part = qty / pos.qty;
  pos.marginJPY *= (1 - part);
  pos.qty -= qty;
  if (pos.qty <= 1e-9) state.positions = state.positions.filter(p => p.id !== pos.id);
  recordTrade(inst, side, qty, px, fee, pnl, why || 'close');
  // PDT 计数（美股同日往返）
  if (inst.mkt === 'US' && inst.kind === 'stock') {
    const sameDay = sameTradingDay(pos.openedAt, state.clock, MARKETS.US.tz);
    if (sameDay) state.dayTrades.push(state.clock);
    state.dayTrades = state.dayTrades.filter(t => state.clock - t < 5 * 86400000);
  }
  logLine(why === 'liq' ? 'risk' : 'trade',
    `${why === 'liq' ? '强制平仓' : side > 0 ? '买入平仓' : '卖出平仓'} ${inst.name} ${fmtQty(inst, qty)} @ ${num(px, px < 10 ? 4 : 2)} 盈亏 ${sgn(pnl - fee.jpy, 0)}`);
  return pnl - fee.jpy;
}

function sameTradingDay(a, b, tz) {
  const f = t => new Date(new Date(t).toLocaleString('en-US', { timeZone: tz })).toDateString();
  return f(a) === f(b);
}

function recordTrade(inst, side, qty, px, fee, pnl, kind) {
  state.trades.unshift({
    id: uid(), t: state.clock, sym: inst.id, name: inst.name, mkt: inst.mkt,
    side, qty, px, feeCcy: inst.ccy, fee: fee.total, feeJpy: fee.jpy,
    pnl, kind, instKind: inst.kind
  });
  if (state.trades.length > 600) state.trades.pop();
}

function fmtQty(inst, q) {
  if (inst.kind === 'fut') return q + ' 手';
  if (inst.kind === 'fx') return num(q, 2) + ' 手';
  return fmtN(q, 0) + ' 股';
}

/* ============================================================
   10. 下单校验与执行
   ============================================================ */
function validateOrder(inst, dir, qty, lev, type, limitPx) {
  const err = [];
  const q = quotes[inst.id];
  const A = account();
  if (q.halt > state.clock) err.push('该品种触发熔断/停牌，暂停交易');
  const ss = sessionState(inst);
  if (!ss.open) err.push(`${MARKETS[inst.mkt].label}市场当前休市（${ss.txt}）`);

  if (inst.kind === 'stock') {
    if (qty <= 0 || qty % inst.lot !== 0) err.push(`数量须为 ${inst.lot} 股的整数倍（每手 ${inst.lot} 股）`);
  } else if (inst.kind === 'fut') {
    if (qty < 1 || qty % 1 !== 0) err.push('期货数量须为整数手');
  } else {
    if (qty < 0.1 || Math.abs((qty * 10) % 1) > 1e-9) err.push('外汇最小 0.1 手（10,000 基础货币）');
  }
  if (type === 'lmt' && (!Number.isFinite(limitPx) || limitPx <= 0)) err.push('限价无效');

  const px = type === 'lmt' ? limitPx : dir > 0 ? q.ask : q.bid;
  const needMargin = marginOf(inst, qty, px, lev);
  const fee = calcFee(inst, dir, qty, px);
  if (needMargin + fee.jpy > A.avail) {
    err.push(`可用资金不足：需保证金 ${fmtN(needMargin, 0)} + 费用 ${fmtN(fee.jpy, 0)}，可用 ${fmtN(A.avail, 0)} JPY`);
  }
  // PDT：美股日内往返
  if (inst.mkt === 'US' && inst.kind === 'stock') {
    const eqUSD = jpy2(A.equity, 'USD');
    const hasSameDay = state.positions.some(p => p.sym === inst.id && p.dir === -dir &&
      sameTradingDay(p.openedAt, state.clock, MARKETS.US.tz));
    if (hasSameDay && state.dayTrades.length >= 3 && eqUSD < 25000) {
      err.push('PDT 规则：5 日内第 4 笔日内往返且账户权益 < $25,000，委托被拒');
    }
  }
  return { err, needMargin, fee, px, avail: A.avail };
}

function submitOrder(inst, dir, qty, lev, type, limitPx) {
  const v = validateOrder(inst, dir, qty, lev, type, limitPx);
  if (v.err.length) { toast('委托被拒', v.err[0], 'err'); logLine('risk', '拒单：' + v.err[0]); return false; }
  if (type === 'lmt') {
    state.orders.push({
      id: uid(), sym: inst.id, dir, qty, filled: 0, lev,
      type, limitPx, t: state.clock, status: 'open'
    });
    toast('已挂单', `${inst.name} ${dir > 0 ? '买入' : '卖出'} ${fmtQty(inst, qty)} @ ${num(limitPx, limitPx < 10 ? 4 : 2)}`, 'ok');
    logLine('order', `挂单 ${inst.name} ${fmtQty(inst, qty)} 限价 ${num(limitPx, limitPx < 10 ? 4 : 2)}`);
  } else {
    const slip = slippage(inst, qty, v.px);
    const fillPx = roundPx(inst, v.px + dir * slip);
    const filled = applyFill(inst, dir, qty, fillPx, lev, v.avail);
    if (filled > 1e-9) {
      toast('成交', `${inst.name} ${dir > 0 ? '买入' : '卖出'} ${fmtQty(inst, filled)} @ ${num(fillPx, fillPx < 10 ? 4 : 2)}`, 'ok');
    }
  }
  save(); renderAll();
  return true;
}

function roundPx(inst, p) {
  const t = inst.kind === 'fx' ? inst.pip : (inst.tick || 0.01);
  return Math.round(p / t) * t;
}

function slippage(inst, qty, px) {
  const q = quotes[inst.id];
  const n = qty2notional(inst, qty, px);
  // 冲击成本按该品种典型盘口深度折算，避免小单产生不真实的大幅滑点
  const depth = inst.kind === 'fx' ? 5e12 : inst.kind === 'fut' ? 4e11 : 1e10;
  const impact = clamp(n / depth, 0, 0.0015) * (0.5 + RNG());
  const base = inst.kind === 'fx' ? px * 0.000008 * RNG() : px * 0.00008 * (0.3 + RNG());
  return base + px * impact;
}

function applyFill(inst, dir, qty, px, lev, avail) {
  let remain = qty, done = 0;
  const opp = state.positions.find(p => p.sym === inst.id && p.dir === -dir);
  if (opp) {
    const closeQ = Math.min(opp.qty, remain);
    closePos(opp, closeQ, px, 'close');
    remain -= closeQ;
    done += closeQ;
  }
  if (remain > 1e-9) {
    const av = Number.isFinite(avail) ? avail : account().avail;
    const need = marginOf(inst, remain, px, lev);
    if (need > av + 1) {
      toast('部分成交', `剩余 ${fmtQty(inst, remain)} 因资金不足未能开仓`, 'warn');
      logLine('risk', `资金不足，${inst.name} ${fmtQty(inst, remain)} 未开仓`);
    } else {
      openPos(inst, dir, remain, px, lev);
      done += remain;
    }
  }
  return done;
}

/* ============================================================
   11. 挂单撮合
   ============================================================ */
function matchOrders() {
  for (const o of [...state.orders]) {
    if (o.status !== 'open') continue;
    const inst = IMAP[o.sym], q = quotes[o.sym];
    let hit = false, px = o.limitPx;
    if (o.dir > 0 && q.ask <= o.limitPx) { hit = true; px = Math.min(o.limitPx, q.ask); }
    if (o.dir < 0 && q.bid >= o.limitPx) { hit = true; px = Math.max(o.limitPx, q.bid); }
    if (!hit) continue;
    if (!sessionState(inst).open || q.halt > state.clock) continue;
    // 部分成交模拟
    const rest = o.qty - o.filled;
    let fillQ = rest;
    if (RNG() < 0.35 && inst.kind === 'stock' && rest > inst.lot) {
      fillQ = Math.max(inst.lot, Math.floor(rest * (0.3 + RNG() * 0.5) / inst.lot) * inst.lot);
    }
    const A = account(o.id);
    let need = marginOf(inst, fillQ, px, o.lev);
    if (need > A.avail) {
      // 资金不足时按可负担数量缩减本次成交量（挂单保持未成交）
      const unit = inst.kind === 'stock' ? inst.lot : inst.kind === 'fut' ? 1 : 0.1;
      while (fillQ >= unit && need > A.avail) {
        fillQ = Math.round((fillQ - unit) * 1e6) / 1e6;
        need = marginOf(inst, fillQ, px, o.lev);
      }
      if (fillQ < unit) continue;
    }
    const done = applyFill(inst, o.dir, fillQ, px, o.lev, A.avail);
    if (done <= 1e-9) continue;
    o.filled += done;
    if (o.filled >= o.qty - 1e-6) o.status = 'filled';
    updateSeeded();
    logLine('order', `挂单成交 ${inst.name} ${fmtQty(inst, done)} @ ${num(px, px < 10 ? 4 : 2)}`);
  }
  state.orders = state.orders.filter(o => o.status === 'open');
}
function updateSeeded() { state.seed = (state.seed * 1103515245 + 12345) & 0x7fffffff; }

/* ============================================================
   12. 风控：追保与强平
   ============================================================ */
function runRisk() {
  const A = account();
  if (state.positions.length === 0) { state.marginCall = null; return; }
  const equity = A.equity;

  // 强平：权益低于维持保证金要求
  if (equity < A.maint) {
    liquidate('权益跌破维持保证金要求', 1.06);
    return;
  }
  // 追保：权益低于维持要求 125%
  if (equity < A.maint * 1.25) {
    if (!state.marginCall) {
      state.marginCall = { since: state.clock, deadline: state.clock + 24 * 3600000 };
      toast('追加保证金通知', `保证金率 ${num(A.ratio, 1)}%，请在 24 小时（模拟时间）内补足或减仓`, 'err');
      logLine('risk', `追保通知：保证金率 ${num(A.ratio, 1)}%，维持要求 ${fmtN(A.maint, 0)}`);
    } else if (state.clock > state.marginCall.deadline) {
      // 追保未补足：平仓至权益回到追保线（维持要求 135%）以上
      liquidate('追保超时未补足', 1.35);
    }
  } else if (state.marginCall && equity > A.maint * 1.4) {
    state.marginCall = null;
    toast('追保解除', '账户已回到安全水位', 'ok');
    logLine('risk', '追保解除');
  }
}

function liquidate(reason, target = 1.06) {
  const A0 = account();
  // 亏损从大到小依次强平，直到权益回到目标水位
  const list = [...state.positions].sort((a, b) => pnlOf(a) - pnlOf(b));
  let n = 0;
  for (const p of list) {
    const now = account();
    if (now.maint > 0 && now.equity >= now.maint * target) break;
    if (now.maint === 0) break;
    const inst = IMAP[p.sym], q = quotes[p.sym];
    if (!inst || !q) continue;
    const px = roundPx(inst, p.dir > 0 ? q.bid * (1 - 0.0015) : q.ask * (1 + 0.0015));
    closePos(p, p.qty, px, 'liq');
    n++;
  }
  if (n === 0) {
    // 触及风控阈值但无需平仓（例如仅跌破追保线），不计入强平次数
    logLine('risk', `${reason}：当前无需平仓，等待客户自行减仓`);
    return 0;
  }
  state.liquidationCount++;
  state.marginCall = null;
  const eqNow = account().equity;
  toast('强制平仓', `${reason}，已平掉 ${n} 个持仓，权益 ${fmtN(eqNow, 0)} JPY`, 'err');
  logLine('risk', `强制平仓（${reason}）：平仓 ${n} 个，权益 ${fmtN(A0.equity, 0)} → ${fmtN(eqNow, 0)}`);
  if (eqNow < 0) showAirborne(eqNow);        // 资不抵债：空中飞人
  return n;
}

// 爆仓且总权益为负 → 「空中飞人！」
function showAirborne(equity) {
  const a = $('#flyEq'), b = $('#flySrc');
  if (a) a.textContent = fmtN(equity, 0);
  if (b) b.textContent = fmtN(state.initEquity, 0);
  openModal('maskFly');
  if (window.applyI18n) window.applyI18n($('#maskFly'));
}

/* ============================================================
   13. 每交易日结算：盯市 / 融资利息 / 隔夜利息
   ============================================================ */
function nextSettleTime(from) {
  const d = mktNow(MARKETS.JP.tz);
  const t = new Date(d);
  t.setHours(6, 0, 0, 0);
  if (t.getTime() <= d.getTime()) t.setDate(t.getDate() + 1);
  return from + (t.getTime() - d.getTime());
}

function dailyRollover() {
  const dow = mktNow(MARKETS.JP.tz).getDay();     // 3 = 周三，三倍隔夜
  const mult = dow === 3 ? 3 : 1;
  let fee = 0, lines = [];

  for (const p of [...state.positions]) {
    const inst = IMAP[p.sym], q = quotes[p.sym];
    if (inst.kind === 'fut') {
      // 逐日盯市：浮动盈亏realize，持仓成本重置为结算价
      const pnlNat = p.dir * p.qty * inst.mult * (q.px - p.entry);
      const pnl = cvt(pnlNat, inst.ccy);
      moveCash(inst.ccy, pnlNat);
      state.realized += pnl;
      p.entry = q.px;
      state.trades.unshift({
        id: uid(), t: state.clock, sym: inst.id, name: inst.name, mkt: inst.mkt,
        side: 0, qty: p.qty, px: q.px, feeCcy: inst.ccy, fee: 0, feeJpy: 0,
        pnl, kind: 'settle', instKind: 'fut'
      });
      lines.push(`${inst.name} 盯市结算 ${sgn(pnl, 0)}`);
      continue;
    }
    if (inst.kind === 'stock') {
      const notional = notionalOf(p);
      let cost = 0;
      const extraRate = p.lev > inst.levMax + 1e-9 ? THIRD_EXTRA_RATE : 0;
      if (p.dir > 0) cost = notional * (1 - 1 / p.lev) * (inst.longRate + extraRate) / 365 * mult;
      else cost = notional * inst.shortRate / 365 * mult;
      moveCash('JPY', -cost); state.swapTotal += cost; fee += cost;
      p.swapAcc += cost;
      lines.push(`${inst.name} ${p.dir > 0 ? '融资利息' : '借券费'} -${fmtN(cost, 0)}`);
      continue;
    }
    if (inst.kind === 'fx') {
      const notionalJPY = notionalOf(p);
      const carry = (p.dir > 0 ? (inst.rBase - inst.rQuote) : (inst.rQuote - inst.rBase)) - 0.5;
      const amt = notionalJPY * carry / 100 / 365 * mult;
      moveCash('JPY', amt); state.swapTotal -= amt; fee -= amt;
      p.swapAcc -= amt;
      if (Math.abs(amt) > 1) lines.push(`${inst.name} 隔夜利息 ${sgn(amt, 0)}`);
    }
  }
  if (lines.length) logLine('settle', `每交易日结算：${lines.slice(0, 4).join('；')}${lines.length > 4 ? ` 等 ${lines.length} 项` : ''}`);
  // 新交易日：重置昨收/开高低，解除停牌
  INST.forEach(i => {
    const q = quotes[i.id];
    if (q.src === 'live') return;
    q.prev = q.px; q.open = q.px; q.hi = q.px; q.lo = q.px; q.halt = 0;
  });
  state.nextSettle = state.clock + 24 * 3600000;
  applySettlements();
}

function applySettlements() {
  // 卖出回款 T+N 到账（仅记账展示，现金已即时可用）
  state.settlements = state.settlements.filter(s => {
    if (s.at <= state.clock) { logLine('settle', `交收完成 ${s.ccy} ${fmtN(s.amt, 0)}`); return false; }
    return true;
  });
}

/* ============================================================
   14. 涨跌停 / 熔断
   ============================================================ */
function jpLimitPct(px) {
  if (px < 100) return 0.30; if (px < 200) return 0.30; if (px < 500) return 0.16;
  if (px < 700) return 0.14; if (px < 1000) return 0.15; if (px < 1500) return 0.20;
  if (px < 2000) return 0.20; if (px < 3000) return 0.17; if (px < 5000) return 0.14;
  if (px < 7000) return 0.14; if (px < 10000) return 0.15; if (px < 15000) return 0.13;
  return 0.12;
}
function checkHalt(inst) {
  const q = quotes[inst.id];
  if (q.src === 'live') return;
  if (q.halt > state.clock) return;
  if (!q.prev) return;
  const move = q.px / q.prev - 1;
  let lim = inst.mkt === 'JP' ? jpLimitPct(q.prev) : inst.mkt === 'US' ? 0.10 : inst.mkt === 'HK' ? 0.10 : inst.mkt === 'FUT' ? 0.07 : 0;
  if (!lim) return;
  if (Math.abs(move) >= lim) {
    q.halt = state.clock + 5 * 60000;
    logLine('risk', `${inst.name} 触发${inst.mkt === 'US' ? 'LULD 熔断' : inst.mkt === 'HK' ? '市调机制' : '涨跌停'}，暂停 5 分钟`);
    toast('停牌 / 熔断', `${inst.name} 波动 ${num(move * 100, 2)}% 触及限制，暂停交易 5 分钟`, 'warn');
  }
}

/* ============================================================
   15. 主循环
   ============================================================ */
let loopTimer = null;
function tick() {
  const realNow = Date.now();
  const realDt = Math.min(30000, realNow - state.lastTick);
  state.lastTick = realNow;

  const isSim = feed.status !== 'live';
  const simDt = isSim ? realDt * state.accel / 1000 : realDt / 1000;
  state.clock = isSim ? state.clock + simDt * 1000 : realNow;

  if (isSim) simStep(Math.max(1, simDt));
  else {
    // 实时模式：只刷新点差
    INST.forEach(i => { if (quotes[i.id].src === 'live') applySpread(i, state.clock); });
  }

  INST.forEach(checkHalt);
  matchOrders();
  runRisk();

  const A = account();
  const last = state.eq[state.eq.length - 1];
  if (!last || state.clock - last.t > 5000) {
    state.eq.push({ t: state.clock, v: A.equity });
    if (state.eq.length > 3000) state.eq.shift();
  }
  if (!state.nextSettle) state.nextSettle = nextSettleTime(state.clock);
  if (state.clock >= state.nextSettle) dailyRollover();

  if (realNow - state.lastSave > 15000) save();
  renderAll();
}

function newsTick() {
  // 每个"交易日"内按时点触发一次宏观事件
  const M = mktNow('Asia/Tokyo');
  const mins = M.getHours() * 60 + M.getMinutes();
  NEWS.forEach(n => {
    const dayKey = n.mkt + new Date(state.clock).toDateString() + n.t;
    if (Math.abs(mins - n.minute) < 2 && !activeNews.find(a => a.key === dayKey)) {
      activeNews.push({ ...n, key: dayKey, until: state.clock + 20 * 60000 });
      toast('宏观事件', `${n.t}，波动率放大`, 'warn');
      logLine('news', `宏观事件：${n.t}（${MARKETS[n.mkt]?.label || n.mkt}）`);
    }
  });
  activeNews = activeNews.filter(n => n.until > state.clock);
}

/* ============================================================
   16. 图表
   ============================================================ */
let chartHover = null;          // 十字光标位置（画布内 CSS 像素），null = 未悬停
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(r.width * dpr)), H = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: r.width, h: r.height };
}
function pxFmt(inst, v) {
  if (inst.kind === 'fx') return num(v, inst.pip < 0.001 ? 5 : 3);
  if (inst.kind === 'fut') return num(v, inst.tick < 0.1 ? 3 : 2);
  return num(v, v < 10 ? 3 : 2);
}

const TX = s => (window.i18nText ? window.i18nText(s) : s);   // 画布文字走字典（DOM 扫描管不到 canvas）
function barTimeText(t) {
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  const intraday = /^m(1|5|10)$/.test(ui.tf || 'm1');
  const md = `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  return intraday ? `${md} ${p(d.getHours())}:${p(d.getMinutes())}` : `${d.getFullYear()}-${md}`;
}

function drawChart() {
  const cv = $('#chart');
  if (!cv || cv.offsetParent === null) return;
  const { ctx, w, h } = fitCanvas(cv);
  ctx.clearRect(0, 0, w, h);
  const inst = IMAP[ui.sym], q = quotes[ui.sym];
  const bars = chartBars(inst);
  if (!bars.length) {
    const label = { d: '日线', w: '周线', m: '月线', q: '季线', y: '年线' }[ui.tf] || '该周期';
    ctx.fillStyle = '#5A6675';
    ctx.font = '12px "MiSans","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${label}历史数据不可用`, w / 2, h / 2 - 6);
    ctx.fillStyle = '#3B4654';
    ctx.font = '10.5px "MiSans","PingFang SC",sans-serif';
    ctx.fillText('免费源未提供海外股票历史K线，1M / 5M / 10M 正常', w / 2, h / 2 + 12);
    return;
  }
  const padL = 6, padR = 58, padT = 10, padB = 16;
  const hi = Math.max(...bars.map(b => b.h)), lo = Math.min(...bars.map(b => b.l));
  const range = (hi - lo) || (hi * 0.01);
  const y = p => padT + (hi - p) / range * (h - padT - padB);
  const plotW = w - padL - padR;
  // 柱宽上限 14px：刚切到实时、bars 只有 1~2 根时，若按 屏宽/根数 算会画出撑满全屏的巨型方块
  const bw = Math.min(14, plotW / Math.max(1, bars.length));
  const x0 = padL + plotW - bars.length * bw;      // 不足一屏时靠右对齐，最新一根贴右边

  // 网格
  ctx.strokeStyle = '#161C24'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const yy = padT + (h - padT - padB) * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
  }
  // K 线
  bars.forEach((b, i) => {
    const x = x0 + i * bw;
    const up = b.c >= b.o;
    const col = up ? '#F0553F' : '#12B57E';
    ctx.strokeStyle = col; ctx.fillStyle = col;
    const yO = y(b.o), yC = y(b.c);
    const top = Math.min(yO, yC), hh = Math.max(1, Math.abs(yC - yO));
    ctx.fillRect(x + bw * 0.22, top, Math.max(1, bw * 0.56), hh);
    ctx.beginPath(); ctx.moveTo(x + bw * 0.5, y(b.h)); ctx.lineTo(x + bw * 0.5, y(b.l));
    ctx.lineWidth = 1; ctx.stroke();
  });
  // 刚切到实时：只有很少几根，补一句说明，避免被当成画坏了
  if (bars.length < 5) {
    ctx.fillStyle = '#4A5563';
    ctx.font = '11.5px "MiSans","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('实时K线累积中，每分钟生成一根', padL + plotW / 2, h - padB - 10);
  }
  // 昨收
  if (q.prev) {
    ctx.strokeStyle = '#39434F'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y(q.prev)); ctx.lineTo(w - padR, y(q.prev)); ctx.stroke();
    ctx.setLineDash([]);
  }
  // 持仓成本线（超出可视区间时贴边显示并加箭头，避免"看不见成本线"）
  state.positions.filter(p => p.sym === ui.sym).forEach(p => {
    const raw = y(p.entry);
    const top = padT + 7, bot = h - padB - 7;
    const offUp = raw < top, offDn = raw > bot;
    const yy = clamp(raw, top, bot);
    const col = p.dir > 0 ? '#F0553F' : '#12B57E';
    ctx.strokeStyle = p.dir > 0 ? 'rgba(240,85,63,.55)' : 'rgba(18,181,126,.55)';
    ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.setLineDash([]);
    const label = (offUp ? '▲ ' : offDn ? '▼ ' : '') + (p.dir > 0 ? '多' : '空') + ' ' + pxFmt(inst, p.entry);
    ctx.font = '9px ui-monospace,monospace'; ctx.textAlign = 'left';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(8,10,14,.88)';
    ctx.fillRect(padL + 1, yy - 12, tw + 7, 12);
    ctx.fillStyle = col;
    ctx.fillText(label, padL + 4, yy - 3);
  });
  // 价格轴
  ctx.fillStyle = '#5A6675'; ctx.font = '10px ui-monospace,monospace'; ctx.textAlign = 'left';
  for (let i = 0; i <= 4; i++) {
    const p = hi - range * i / 4;
    ctx.fillText(pxFmt(inst, p), w - padR + 5, padT + (h - padT - padB) * i / 4 + 3);
  }
  // 最新价
  const lastC = bars[bars.length - 1].c, ly = clamp(y(lastC), padT + 8, h - padB - 8);
  ctx.fillStyle = '#3D8BFF'; ctx.fillRect(w - padR, ly - 8, padR - 2, 16);
  ctx.fillStyle = '#fff'; ctx.fillText(pxFmt(inst, lastC), w - padR + 5, ly + 4);

  // ---------- 十字光标 ----------
  if (chartHover && chartHover.mx >= padL && chartHover.mx <= w - padR &&
      chartHover.my >= padT && chartHover.my <= h - padB) {
    const i = clamp(Math.floor((chartHover.mx - x0) / bw), 0, bars.length - 1);
    const b = bars[i];
    const cx = x0 + (i + 0.5) * bw;
    const my = clamp(chartHover.my, padT, h - padB);
    ctx.save();
    ctx.strokeStyle = 'rgba(150,168,190,.42)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, h - padB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, my); ctx.lineTo(w - padR, my); ctx.stroke();
    ctx.setLineDash([]);

    // 右侧：光标所在价位的价格
    const pAt = clamp(hi - (my - padT) / (h - padT - padB) * range, lo, hi);
    ctx.font = '10px ui-monospace,monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#2E3946'; ctx.fillRect(w - padR, my - 8, padR - 2, 16);
    ctx.fillStyle = '#E6EDF5'; ctx.fillText(pxFmt(inst, pAt), w - padR + 5, my + 4);

    // 底部：该根 K 线的时间
    const tTxt = barTimeText(b.t);
    ctx.textAlign = 'center';
    const tw2 = ctx.measureText(tTxt).width;
    ctx.fillStyle = '#2E3946';
    ctx.fillRect(cx - tw2 / 2 - 6, h - padB + 2, tw2 + 12, 14);
    ctx.fillStyle = '#E6EDF5'; ctx.fillText(tTxt, cx, h - padB + 12);

    // 左上：开高低收 + 涨跌幅
    const pct = b.o ? (b.c - b.o) / b.o * 100 : 0;
    const seg1 = tTxt + '  ';
    const seg2 = `${TX('开')} ${pxFmt(inst, b.o)}  ${TX('高')} ${pxFmt(inst, b.h)}  ` +
                 `${TX('低')} ${pxFmt(inst, b.l)}  ${TX('收')} ${pxFmt(inst, b.c)}  `;
    const seg3 = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    ctx.font = '11px ui-monospace,monospace'; ctx.textAlign = 'left';
    const bx = padL + 6, by = padT + 13;
    const w1 = ctx.measureText(seg1).width, w2 = ctx.measureText(seg2).width, w3 = ctx.measureText(seg3).width;
    ctx.fillStyle = 'rgba(8,10,14,.92)';
    ctx.fillRect(bx - 5, by - 11, w1 + w2 + w3 + 14, 16);
    ctx.fillStyle = '#7C8A9A'; ctx.fillText(seg1, bx, by);
    ctx.fillStyle = '#E6EDF5'; ctx.fillText(seg2, bx + w1, by);
    ctx.fillStyle = b.c >= b.o ? '#F0553F' : '#12B57E'; ctx.fillText(seg3, bx + w1 + w2, by);
    ctx.restore();
  }
}

function drawEquity() {
  const cv = $('#eqchart');
  if (!cv || cv.offsetParent === null) return;
  const { ctx, w, h } = fitCanvas(cv);
  ctx.clearRect(0, 0, w, h);
  const eq = state.eq;
  if (eq.length < 2) {
    ctx.fillStyle = '#5A6675'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂无足够数据', w / 2, h / 2);
    return;
  }
  const padL = 54, padR = 12, padT = 12, padB = 18;
  const vs = eq.map(e => e.v);
  let hi = Math.max(...vs), lo = Math.min(...vs);
  const pad = (hi - lo) * 0.1 || hi * 0.01;
  hi += pad; lo -= pad;
  const x = i => padL + (w - padL - padR) * i / (eq.length - 1);
  const y = v => padT + (hi - v) / (hi - lo) * (h - padT - padB);

  ctx.strokeStyle = '#1A212A';
  for (let i = 0; i <= 3; i++) {
    const yy = padT + (h - padT - padB) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.fillStyle = '#5A6675'; ctx.font = '9.5px ui-monospace,monospace'; ctx.textAlign = 'right';
    ctx.fillText((hi - (hi - lo) * i / 3).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ','), padL - 5, yy + 3);
  }
  const grad = ctx.createLinearGradient(0, padT, 0, h - padB);
  const rising = vs[vs.length - 1] >= vs[0];
  grad.addColorStop(0, rising ? 'rgba(240,85,63,.28)' : 'rgba(18,181,126,.28)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.moveTo(x(0), y(vs[0]));
  vs.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.lineTo(x(vs.length - 1), h - padB); ctx.lineTo(x(0), h - padB); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x(0), y(vs[0]));
  vs.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.strokeStyle = rising ? '#F0553F' : '#12B57E'; ctx.lineWidth = 1.6; ctx.stroke();
  // 起始资金基准
  const base = y(state.initEquity);
  if (base > padT && base < h - padB) {
    ctx.strokeStyle = '#39434F'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, base); ctx.lineTo(w - padR, base); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function applyLevPreset(v) {
  const inst = IMAP[ui.sym];
  if (inst.kind === 'fut') {
    toast('期货不设杠杆档位', '杠杆由每手保证金固定决定，不能单独调整', 'warn');
    return;

  const hard = hardMaxOf(inst);
  if (v > hard + 1e-9) {
    toast('超出硬上限', `最高 ${hard}×`, 'warn');

  if (isThird(inst, v)) { askThirdParty(inst, v); return; }

}

function askThirdParty(inst, lev) {
  const notional = qty2notional(inst, currentQty(), quotes[inst.sym] ? quotes[inst.sym].px : 0);
  $('#confirmBody').innerHTML = `
    <p style="font-size:12px;color:var(--mut);line-height:1.8;margin-bottom:10px">
      <b style="color:var(--warn)">第三方杠杆 · 超出监管上限</b><br>
      ${MARKETS[inst.mkt].label}市场常规上限为 <b>${num(inst.levMax, 2)}×</b>，你将使用 <b style="color:var(--dgr)">${lev}×</b>。
      超出部分由第三方资金方提供，条款与常规信用交易不同。</p>
    <div class="kv" style="margin-bottom:14px">
      <span>开仓一次性佣金</span><b>${num(THIRD_FEE * 100, 2)}%（名义价值）</b>
      <span>融资利率上浮</span><b>+${num(THIRD_EXTRA_RATE * 100, 1)}% / 年</b>
      <span>维持保证金率</span><b>${num(Math.max(0.01, 0.6 / lev) * 100, 2)}%</b>
      <span>强平风险</span><b style="color:var(--dngr)">显著高于常规杠杆</b>
    </div>
    <button class="btn primary" style="width:100%;padding:8px" id="thirdGo">我已了解风险，使用 ${lev}×</button>`;
  openModal('maskConfirm');
  $('#thirdGo').onclick = () => {

    $('#iLev').value = lev;
