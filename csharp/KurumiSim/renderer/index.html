    toast('已启用第三方杠杆', `${lev}× · 开仓佣金 ${num(THIRD_FEE * 100, 2)}%，融资利率 +${num(THIRD_EXTRA_RATE * 100, 1)}%/年`, 'warn');
    logLine('risk', `启用第三方杠杆 ${inst.name} ${lev}×（常规上限 ${num(inst.levMax, 2)}×）`);
  };
}

function syncLevUI() {
  const inst = IMAP[ui.sym];
  const slider = $('#iLev'), wrap = slider.parentElement;
  if (inst.kind === 'fut') {
    const lev = notionalOf({ sym: inst.id, qty: 1, dir: 1 }) / cvt(inst.margin, inst.ccy);
    wrap.style.opacity = .45; slider.disabled = true;
    slider.max = inst.levMax; slider.value = inst.levMax;
    $('#levTxt').textContent = num(lev, 1) + '×';
    $('#lLevTxt').textContent = '杠杆（由保证金决定）';
  } else {
    wrap.style.opacity = 1; slider.disabled = false;
    slider.max = hardMaxOf(inst); slider.min = 1;
    slider.value = ui.lev;
    $('#levTxt').textContent = num(ui.lev, ui.lev < 10 ? 2 : 1) + '×';
    $('#lLevTxt').textContent = isThird(inst, ui.lev)
      ? `杠杆 ${ui.lev}× · 第三方（保证金率 ${num(100 / ui.lev, 1)}%）`
      : '杠杆（保证金率 ' + num(100 / ui.lev, 1) + '%）';
  }
  const set = $('#levSet');
  const want = levPresets(inst);
  if (set.dataset.sig !== want.join(',')) {
    set.dataset.sig = want.join(',');
    set.innerHTML = want.map(v => `<button type="button" data-lev="${v}">${levLabel(v)}</button>`).join('');
    $$('#levSet button').forEach(b => b.onclick = () => applyLevPreset(Number(b.dataset.lev)));
  }
  $$('#levSet button').forEach(b => {
    const v = Number(b.dataset.lev);
    b.disabled = inst.kind === 'fut' || v > hardMaxOf(inst) + 1e-9;
    b.classList.toggle('on', inst.kind !== 'fut' && Math.abs(ui.lev - v) < 0.01);
    b.classList.toggle('third', isThird(inst, v));
    b.title = inst.kind === 'fut' ? '期货杠杆由每手保证金决定'
      : v > inst.levMax + 1e-9 ? `第三方杠杆 ${v}×（超上限，需确认并收 ${num(THIRD_FEE * 100, 2)}% 佣金）`
      : `设为 ${v}×（保证金率 ${num(100 / v, 1)}%）`;

  $('#lQty').textContent = inst.kind === 'stock' ? `数量（每手 ${inst.lot} 股）`

function renderEst() {
  const inst = IMAP[ui.sym], q = quotes[ui.sym];
  const qty = currentQty();
  const lev = inst.kind === 'fut' ? 1 : ui.lev;
  const px = ui.type === 'lmt' && Number($('#iLimit').value) > 0
    ? Number($('#iLimit').value) : ui.side > 0 ? q.ask : q.bid;
  const notional = qty2notional(inst, qty, px);
  const margin = marginOf(inst, qty, px, lev);
  const fee = calcFee(inst, ui.side, qty, px);
  const lp = liqPrice(inst, ui.side, px, lev);
  const tickVal = inst.kind === 'fut' ? inst.mult * rateToJPY(inst.ccy)
    : inst.kind === 'fx' ? inst.pip * qty * inst.units * rateToJPY(inst.ccy)
    : null;
  const items = [
    ['名义价值', fmtN(notional, 0) + ' JPY'],
    ['占用保证金', fmtN(margin, 0) + ' JPY'],
    ['费用合计', fmtN(fee.jpy, 0) + ' JPY'],
    ['逐仓参考强平价', lp > 0 ? pxFmt(inst, lp) : '—（无杠杆）'],
  ];
  if (tickVal !== null) items.push([inst.kind === 'fut' ? '每点价值' : '每 pip 价值', fmtN(tickVal, 0) + ' JPY']);
  // 资金可承受上限：按单手（股票按 1 股）的保证金 + 费用折算，避免敲到提交才被打回
  const A = account();
  const unitMargin = marginOf(inst, 1, px, lev);
  const unitFee = Math.max(0, calcFee(inst, ui.side, 1, px).jpy);
  const step = inst.kind === 'stock' ? inst.lot : inst.kind === 'fx' ? 0.1 : 1;
  const rawMax = unitMargin + unitFee > 0 ? A.avail / (unitMargin + unitFee) : 0;
  const maxQty = Math.max(0, Math.round(Math.floor(rawMax / step) * step * 100) / 100);
  const over = qty > maxQty + 1e-9;
  items.push(['最多可开', maxQty > 0 ? fmtQty(inst, maxQty) : '资金不足']);
  $('#estBox').innerHTML = items.map(([a, b], i) =>
    `<div><span>${a}</span><b class="${i === 2 ? 'hl' : ''}${a === '最多可开' && over ? ' bad' : ''}">${b}</b></div>`).join('')
    + `<div class="feedetail" style="grid-column:1/-1"><span>费用明细</span><b>${
      fee.items.map(x => `${x.k} ${num(x.v, 2)}`).join(' · ')}</b></div>`
    + (over
      ? `<div class="overrow" style="grid-column:1/-1">超出可用资金，<a href="#" id="useMax">改为最多 ${fmtQty(inst, maxQty)}</a></div>`
      : '');
  const um = $('#useMax');
  if (um) um.onclick = e => {
    e.preventDefault();
    $('#iQty').value = inst.kind === 'fx' ? Math.round(maxQty * 10) / 10 : maxQty;
    renderEst();
  };
  const st = $('#btnSubmit');
  st.className = 'submit ' + (ui.side > 0 ? 'buy' : 'sell') + (over ? ' cant' : '');
  st.disabled = over;
  st.textContent = over
    ? `资金不足 · 最多 ${fmtQty(inst, maxQty)}`
    : (ui.side > 0 ? '买入 / 做多 ' : '卖出 / 做空 ') + inst.name + ' ' + fmtQty(inst, qty);
}

function renderPerf() {
  const A = account();
  const eq = state.eq;
  const totalRet = (A.equity / state.initEquity - 1) * 100;
  let peak = -Infinity, mdd = 0;
  eq.forEach(e => { peak = Math.max(peak, e.v); mdd = Math.min(mdd, (e.v / peak - 1) * 100); });
  // 夏普：按模拟小时重采样后再年化，避免 5 秒采样放大噪声
  let sharpe = 0;
  if (eq.length > 4) {
    const buckets = [];
    eq.forEach(e => {
      const b = Math.floor(e.t / 3600000);
      if (!buckets.length || buckets[buckets.length - 1].b !== b) buckets.push({ b, v: e.v });
      else buckets[buckets.length - 1].v = e.v;
    });
    if (buckets.length >= 4) {
      const rets = [];
      for (let i = 1; i < buckets.length; i++) if (buckets[i - 1].v > 0) rets.push(buckets[i].v / buckets[i - 1].v - 1);
      const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
      const sd = Math.sqrt(rets.reduce((a, b) => a + (b - mean) ** 2, 0) / rets.length);
      sharpe = sd > 0 ? clamp((mean / sd) * Math.sqrt(365 * 24), -9.99, 9.99) : 0;
    }
  }
  const closed = state.trades.filter(t => t.kind === 'close' || t.kind === 'liq');
  const wins = closed.filter(t => t.pnl > 0), losses = closed.filter(t => t.pnl <= 0);
  const winRate = closed.length ? wins.length / closed.length * 100 : 0;
  const gp = wins.reduce((a, b) => a + b.pnl, 0), gl = Math.abs(losses.reduce((a, b) => a + b.pnl, 0));
  const pf = gl > 0 ? gp / gl : (gp > 0 ? 99 : 0);

  const cards = [
    ['账户权益', fmtN(A.equity, 0), A.equity >= state.initEquity ? 'up' : 'dn'],
    ['总收益率', sgn(totalRet, 2) + '%', totalRet >= 0 ? 'up' : 'dn'],
    ['已实现盈亏', sgn(state.realized, 0), state.realized >= 0 ? 'up' : 'dn'],
    ['最大回撤', num(mdd, 2) + '%', 'dn'],
    ['夏普比率', num(sharpe, 2), sharpe >= 1 ? 'up' : 'flat'],
    ['胜率', num(winRate, 1) + '%', winRate >= 50 ? 'up' : 'flat'],

  $('#eqMeta').textContent = `${eq.length} 个采样点 · 模拟时间 ${num((state.clock - (eq[0]?.t || state.clock)) / 3600000, 1)} 小时`;
  drawEquity();

// K 线周期：1M 原始，5M/10M 按时间桶聚合
function aggregateBars(bars, n) {
  if (!n || n <= 1) return bars;
  const step = n * 60000;
  const out = [];
  let cur = null, key = null;
  for (const b of bars) {
    const k = Math.floor(b.t / step);
    if (!cur || k !== key) {
      if (cur) out.push(cur);
      cur = { t: k * step, o: b.o, h: b.h, l: b.l, c: b.c };
      key = k;
    } else {
      cur.h = Math.max(cur.h, b.h);
      cur.l = Math.min(cur.l, b.l);
      cur.c = b.c;
    }
  }
  if (cur) out.push(cur);
  return out;
}

// 输入代码后自动补公司名（防抖 500ms，用户已填名称则不覆盖）
let addNameTimer = 0;
function scheduleAddNameLookup(code, mkt) {
  clearTimeout(addNameTimer);
  const nameEl = $('#addName');
  if (!nameEl || (nameEl.value || '').trim()) return;
  addNameTimer = setTimeout(async () => {
    const cur = ($('#addCode').value || '').trim().toUpperCase();
    if (cur !== code) return;
    const n = await lookupCompanyName({ id: code, code: code.replace(/\.(T|HK)$/i, ''), mkt });
    if ((($('#addCode').value || '').trim().toUpperCase()) !== code) return;
    if (!n.zh && !n.en) return;
    if (!(nameEl.value || '').trim()) nameEl.value = n.zh || n.en;
    const hint = $('#addHint');
    if (hint) hint.innerHTML += ` · 自动取名 <b style="color:var(--txt)">${n.zh || '—'}</b> / ${n.en || '—'}`;
  }, 500);
}

function doAddSymbol() {
  const code = ($('#addCode').value || '').trim().toUpperCase();
  const name = ($('#addName').value || '').trim();
  const lot = parseInt($('#addLot').value, 10);
  const px = Number($('#addPx').value);
  const mkt = inferMarket(code);
  if (!code) return toast('请填写代码', '例如 NVDA / 7203.T / 0700.HK', 'err');
  if (!mkt) return toast('无法识别的代码', '目前支持日股(.T)、港股(.HK)、美股(直接填代码)', 'err');
  if (IMAP[code]) return toast('已在列表中', `${code} 无需重复添加`, 'warn');
  if (state.custom.length >= CUSTOM_MAX) return toast('自选已满', `最多 ${CUSTOM_MAX} 个，请先移除部分`, 'warn');
  if (!Number.isFinite(px) || px <= 0) return toast('参考价无效', '请填一个大于 0 的价格', 'err');
  if (!Number.isFinite(lot) || lot < 1) return toast('每手股数无效', '至少 1 股', 'err');

  const spec = makeCustomSpec(code, name, lot, px);
  if (!spec) return toast('创建失败', '品种参数异常', 'err');
  state.custom.push({ id: spec.id, name: spec.name, nameEn: '', lot: spec.lot, px: spec.px });
  INST.push(spec);
  IMAP[spec.id] = spec;
  makeQuote(spec, px);
  quotes[spec.id].prev = quotes[spec.id].open;

  closeModal('maskAdd');
  gotoMarket(spec.mkt, spec.id);
  save(); renderAll();
  toast('已添加自选', `${spec.name}（${spec.id}）`, 'ok');
  if (!name) autofillName(spec);          // 没填名字就异步取公司名（不阻塞添加）
  logLine('sys', `添加自选品种 ${spec.name} ${spec.id}，每手 ${spec.lot} 股`);

  // 尝试补真实行情；拉不到就从参考价开始模拟
  if (state.feedMode !== 'sim') {
    fetchOne(spec).then(() => {
      renderAll();
      toast('已同步行情', `${spec.name} ${pxFmt(spec, quotes[spec.id].px)}`, 'ok');
    }).catch(() => {
      toast('暂用模拟行情', '实时行情不可用，已从参考价开始模拟', 'warn');
    });
  }
}

// 添加后异步补公司名（中文名 + 英文名一起存，切语言时各取所需）
async function autofillName(spec) {
  const n = await lookupCompanyName(spec);
  if (!n.zh && !n.en) return;
  spec.nameZh = n.zh || n.en;
  spec.nameEn = n.en || n.zh;
  const picked = pickCustomName(spec);
  if (picked) spec.name = picked;
  const c = (state.custom || []).find(x => x.id === spec.id);
  if (c) { c.name = spec.nameZh; c.nameEn = spec.nameEn; }
  save(); renderAll();
  toast('已自动填入公司名', spec.name, 'ok');
}

function removeCustom(id) {
  const spec = IMAP[id];
  if (!spec || !spec.custom) return;
  if (state.positions.some(p => p.sym === id)) return toast('无法移除', '该品种还有持仓，请先平仓', 'warn');
  if (state.orders.some(o => o.sym === id)) return toast('无法移除', '该品种还有挂单，请先撤单', 'warn');
  state.custom = state.custom.filter(c => c.id !== id);
  const i = INST.indexOf(spec);
  if (i >= 0) INST.splice(i, 1);
  delete IMAP[id];
  delete quotes[id];
  if (ui.sym === id) {
    const first = INST.find(x => x.mkt === state.mkt) || INST[0];
    if (first) setInstrument(first.id);
  }
  save(); renderAll();
  toast('已移出自选', `${spec.name}（${id}）`, 'ok');
  logLine('sys', `移除自选品种 ${spec.name} ${id}`);
}

          <span>逐仓参考强平价</span><b style="color:var(--dngr)">${pxFmt(inst, liqPrice(inst, ui.side, v.px, lev))}</b>        </div>
        <button class="btn primary" style="width:100%;padding:8px" id="cfmGo">确认提交</button>`;
      openModal('maskConfirm');
      $('#cfmGo').onclick = () => { closeModal('maskConfirm'); submitOrder(inst, ui.side, qty, lev, 'mkt', null); };

  if (cvChart) {
    cvChart.addEventListener('mousemove', e => {
      const r = cvChart.getBoundingClientRect();
      chartHover = { mx: e.clientX - r.left, my: e.clientY - r.top };
      drawChart();
    });
    cvChart.addEventListener('mouseleave', () => { chartHover = null; drawChart(); });
  }
  $('#btnHelp').onclick = () => { buildHelp(); openModal('maskHelp'); };
  $$('[data-close]').forEach(b => b.onclick = () => {
    const m = b.closest('.mask'); if (m) m.classList.remove('on');
  });
  $$('.mask').forEach(m => m.onclick = e => { if (e.target === m) m.classList.remove('on'); });
  window.addEventListener('resize', () => { drawChart(); if (state.board === 'perf') drawEquity(); });
  window.addEventListener('beforeunload', save);
}

function openModal(id) { $('#' + id).classList.add('on'); }
function closeModal(id) { $('#' + id).classList.remove('on'); }

function buildSettings() {
  $('#setBody').innerHTML = `
    <div class="frow"><label>行情数据源<i>实时优先，失败自动切换模拟引擎</i></label>
      <select id="sFeed">
        <option value="auto" ${state.feedMode === 'auto' ? 'selected' : ''}>自动（推荐）</option>
        <option value="live" ${state.feedMode === 'live' ? 'selected' : ''}>强制实时</option>
        <option value="sim" ${state.feedMode === 'sim' ? 'selected' : ''}>模拟引擎</option>
      </select></div>
    <div class="frow"><label>本地代理（HTTP / SOCKS5）<i>填本地端口即可，例如 127.0.0.1:6789 或 socks5 代理。空着则为直连，仅用于下载 Yahoo 日线</i></label>
      <input type="text" id="sProxy" value="${state.proxy || ''}" placeholder="留空 = 直连" spellcheck="false"></div>
    <div class="frow"><label>轮询间隔<i>实时模式下拉取行情的频率</i></label>
      <select id="sPoll">
        ${[10, 20, 30, 60, 120].map(s => `<option value="${s * 1000}" ${state.pollMs === s * 1000 ? 'selected' : ''}>${s} 秒</option>`).join('')}
      </select></div>
    <div class="frow"><label>时间倍率<i>仅模拟模式生效，用于观察隔夜利息与逐日盯市</i></label>
      <select id="sAccel">
        ${[1, 10, 60, 300].map(a => `<option value="${a}" ${state.accel === a ? 'selected' : ''}>${a}×</option>`).join('')}
      </select></div>
    <div class="frow"><label>练习模式<i>忽略交易时段限制，休市也能下单</i></label>
      <div class="switch ${state.ignoreSession ? 'on' : ''}" id="sIgnore"></div></div>
    <div class="frow"><label>账户存档<i>桌面版存于 文档\KurumiSim\save.json</i></label>
      <div style="display:flex;gap:6px">
        <button class="btn sm" id="sExp">导出</button>
        <button class="btn sm" id="sImp">导入</button>
        <button class="btn sm" id="sNew">重新开局</button>
        <button class="btn sm" id="sFolder">打开目录</button>
        <button class="btn sm" id="sKl">下载日线</button>
        <button class="btn sm" id="sReset" style="color:var(--dngr);border-color:rgba(255,77,79,.4)">重置账户</button>
      </div></div>
    <div class="hint" style="margin-top:10px">初始资金 ¥10,000,000（日元本位）。重置会清空持仓、挂单与历史记录。</div>`;
  $('#sFeed').onchange = e => { state.feedMode = e.target.value; pollFeed(); save(); };
  $('#sProxy').onchange = e => { state.proxy = e.target.value.trim(); save(); applyProxy(true); };
  $('#sPoll').onchange = e => { state.pollMs = Number(e.target.value); save(); };
  $('#sAccel').onchange = e => { state.accel = Number(e.target.value); save(); };
  $('#sIgnore').onclick = e => {
    state.ignoreSession = !state.ignoreSession;
    e.target.classList.toggle('on', state.ignoreSession);
    save(); renderAll();
  };
  $('#sExp').onclick = () => {
    const blob = new Blob([localStorage.getItem(SAVE_KEY) || '{}'], { type: 'application/json' });
    dl(blob, `invest-sim-持仓存档-${new Date().toISOString().slice(0, 10)}.json`);
  };
  $('#sImp').onclick = async () => {
    // 桌面版：先按短码备份原档，再覆盖载入
    if (window.Kurumi && window.Kurumi.restoreSave) {
      const r = await window.Kurumi.restoreSave();
      if (r && r.ok) toast('已载入存档', r.backup ? `原档已备份为 ${r.backup}` : '原档未变', 'ok');
      else if (r && r.reason !== 'canceled') toast('载入失败', r.reason, 'err');
      return;
    }
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          localStorage.setItem(SAVE_KEY, r.result);
          location.reload();
        } catch (err) { toast('导入失败', String(err), 'err'); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
  $('#sNew').onclick = () => { closeModal('maskSettings'); openStart(); };
  $('#sFolder').onclick = () => { if (window.Kurumi && window.Kurumi.openSaveFolder) window.Kurumi.openSaveFolder(); };
  $('#sKl').onclick = async () => {
    if (!(window.Kurumi && window.Kurumi.downloadKline)) return toast('仅桌面版支持', '请用 exe 运行', 'warn');
    const btn = $('#sKl'); btn.disabled = true;
    let ok = 0, fail = 0;
    for (const inst of INST) {
      btn.textContent = `下载中 ${ok + fail + 1}/${INST.length}`;
      const r = await window.Kurumi.downloadKline(inst.id, inst.yahoo || inst.id);
      if (r && r.n > 0) { ok++; const q = quotes[inst.id]; if (q) { q.kl = {}; } }
      else fail++;
      await new Promise(res => setTimeout(res, 350));   // 放慢，别把代理打崩
    }
    btn.textContent = '下载日线'; btn.disabled = false;
    toast('历史日线下载完成', `成功 ${ok} 个，失败 ${fail} 个`, fail ? 'warn' : 'ok');
    drawChart();
  };
  $('#sReset').onclick = () => {
    if (!confirm('确认重置账户？所有持仓、挂单与历史将被清空（不可撤销）。')) return;
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  };
}

function buildHelp() {
  $('#helpBody').innerHTML = `
    <h4>账户模型</h4>

    <p>权益 = 现金 + 浮动盈亏；可用资金 = 权益 − 占用保证金。</p>

    <ul>

      <li><b>香港股票（HKEX）</b> 每手股数因股而异（腾讯 100、汇丰 400、友邦 200）。初始保证金 40%~45%，维持 30%~35%。费用：佣金 0.03%（低消 HK$50）+ 印花税 0.1%（双向）+ 交易征费 0.0027% + 交易费 0.00565% + FRC 0.00015% + CCASS 结算费 0.002%（2~100）。</li>
      <li><b>期货</b> 保证金制，逐日盯市：每日结算时把浮动盈亏结转现金、持仓成本重置为结算价。日经迷你 ¥120,000/手（维持 ¥108,000），ES $13,200，黄金 $11,000，原油 $6,600，恒指 HK$85,000。手续费按手计。</li>
      <li><b>外汇</b> 1 标准手 = 100,000 基础货币，日本 FSA 个人杠杆上限 25×。成本为点差（0.7~1.0 pip）+ 隔夜利息（利差 − 券商加点 0.5%/年），周三三倍隔夜。</li>

      <li><b>强平线</b>：权益跌破维持保证金要求即触发强制平仓，按亏损从大到小依次平仓，直到权益回到维持要求的 106% 以上。</li>
      <li><b>逐仓参考强平价</b>：假设该仓位独占全部账户权益时的理论强平价，多头 <code>entry × (1 − 1/lev) ÷ (1 − 维持率)</code>，空头对称。杠杆越高，强平价越贴近建仓价。</li>

function exportCSV() {
  const head = ['时间', '板块', '品种', '代码', '类型', '方向', '数量', '成交价', '费用(原币)', '费用(JPY)', '盈亏(JPY)'];
  const mk = { JP: '日本', US: '美国', HK: '香港', FUT: '期货', FX: '外汇' };
  const rows = state.trades.map(t => {
    const inst = IMAP[t.sym] || {};
    return [
      new Date(t.t).toLocaleString('zh-CN', { hour12: false }),
      mk[t.mkt] || '', t.name || '', inst.code || '',
      t.kind === 'settle' ? '盯市结算' : t.kind === 'open' ? '开仓' : t.kind === 'liq' ? '强平' : '平仓',
      t.side > 0 ? '买入' : t.side < 0 ? '卖出' : '—',
      t.qty, t.px, t.fee, t.feeJpy, t.pnl
    ].join(',');
  });
  const csv = '\uFEFF' + head.join(',') + '\n' + rows.join('\n');
  dl(new Blob([csv], { type: 'text/csv;charset=utf-8' }),
    `交易记录-${new Date().toISOString().slice(0, 10)}.csv`);
  toast('已导出', `${state.trades.length} 条成交记录`, 'ok');
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ============================================================
   20. 启动
   ============================================================ */
async function boot() {
  // 先读存档（桌面版读文档目录文件）拿到自选列表，再并进品种表，最后才建报价
  await store.init();
  const loaded = load();
  buildCustomInstruments();
  initQuotes();
  if (loaded && state.nextSettle && state.nextSettle < Date.now()) state.nextSettle = 0;
  bind();
  applyProxy();                    // 把存档里的本地代理同步给 C# 端
  setInstrument('7203.T');
  if (!loaded || !state.started) openStart();
  // 支持 #stock / #fut / #fx / #perf 直达板块
  const hash = (location.hash || '').replace('#', '');
  const navBtn = $$('.boards .nav').find(b => b.dataset.board === hash);
  if (navBtn) navBtn.click();
  renderAll();
  logLine('sys', loaded ? '已载入本地存档' : '新账户初始化，初始资金 ¥10,000,000');

  state.lastTick = Date.now();
  loopTimer = setInterval(() => { tick(); newsTick(); }, 1000);
  pollFeed();
  setInterval(() => { if (feed.status === 'live') pollFeed(); }, Math.max(10000, state.pollMs));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot());
else boot();
</script>
